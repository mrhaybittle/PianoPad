<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PianoPad Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #09090b;
            color: #f4f4f5;
        }
        .break-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #ef4444; /* red-500 */
            z-index: 10;
        }
    </style>
</head>
<body class="min-h-screen p-6 font-sans">
    <header class="mb-8 border-b border-zinc-800 pb-4 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold text-indigo-500 tracking-tight"><i class="fa-solid fa-desktop mr-2"></i>PianoPad Monitor</h1>
            <p class="text-sm text-zinc-400 mt-1">Live tracking of student active status, song selection, and Locked-In Score</p>
        </div>
        <div class="flex items-center gap-3">
            <div class="text-indigo-400 font-mono text-xs bg-zinc-900 px-3 py-2 rounded-lg border border-zinc-800 font-semibold version-stamp">
                v26.09.23 | 23-Sep 11:56 AEST (Sydney)
            </div>
            <div class="text-zinc-500 font-mono text-sm bg-zinc-900 px-4 py-2 rounded-lg border border-zinc-800">
                Live Updates Active <i class="fa-solid fa-circle text-green-500 ml-2 animate-pulse"></i>
            </div>
        </div>
    </header>

    <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Room G1 -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-col h-[600px]">
            <h2 class="text-xl font-bold text-white border-b border-zinc-700 pb-2 mb-3">Room G1</h2>
            <div id="roster-G1" class="flex-1 overflow-y-auto space-y-2 pr-2">
                <div class="text-zinc-600 text-sm italic">Waiting for students...</div>
            </div>
        </div>

        <!-- Room G2 -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-col h-[600px]">
            <h2 class="text-xl font-bold text-white border-b border-zinc-700 pb-2 mb-3">Room G2</h2>
            <div id="roster-G2" class="flex-1 overflow-y-auto space-y-2 pr-2">
                <div class="text-zinc-600 text-sm italic">Waiting for students...</div>
            </div>
        </div>

        <!-- Room G3 -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-col h-[600px]">
            <h2 class="text-xl font-bold text-white border-b border-zinc-700 pb-2 mb-3">Room G3</h2>
            <div id="roster-G3" class="flex-1 overflow-y-auto space-y-2 pr-2">
                <div class="text-zinc-600 text-sm italic">Waiting for students...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBAJSw8QFuzMoCXqZY2wmO3Nmy2Fdy6Q4U",
            authDomain: "haysync-9b816.firebaseapp.com",
            databaseURL: "https://haysync-9b816-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "haysync-9b816",
            storageBucket: "haysync-9b816.firebasestorage.app",
            messagingSenderId: "717730658604",
            appId: "1:717730658604:web:e09a312b2ac7c8426e9489"
        };
            
        let db;
        let cachedData = {};

        try {
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            
            const rosterRef = ref(db, 'pianopad_roster');
            onValue(rosterRef, (snapshot) => {
                cachedData = snapshot.val() || {};
                renderRoster(cachedData);
            });

            setInterval(() => {
                renderRoster(cachedData);
            }, 60000);

        } catch(e) {
            console.error("Firebase connection error:", e);
        }

        function renderRoster(data) {
            const rooms = { "G1": [], "G2": [], "G3": [] };
            
            const now = Date.now();
            
            // Pre-process and calculate metrics for sorting
            const activeStudents = [];
            
            Object.values(data).forEach(student => {
                if (student.room && rooms[student.room]) {
                    if (now - student.lastActive < 7200000) {
                        const switches = student.tabSwitches || 0;
                        const elapsedMs = now - student.lastActive;
                        const elapsedMins = Math.max(0, Math.floor(elapsedMs / 60000));
                        const lockedInMins = Math.max(0, Math.floor(elapsedMs / 60000) - switches);
                        
                        activeStudents.push({
                            ...student,
                            switches,
                            elapsedMins,
                            lockedInMins
                        });
                    }
                }
            });

            // Distribute and Sort into rooms
            activeStudents.forEach(student => {
                rooms[student.room].push(student);
            });

            for (const [roomName, students] of Object.entries(rooms)) {
                const container = document.getElementById(`roster-${roomName}`);
                container.innerHTML = '';
                
                if (students.length === 0) {
                    container.innerHTML = '<div class="text-zinc-600 text-sm italic">Empty</div>';
                    continue;
                }

                // Sort by Locked-In Mins (Highest First), then Breaks (Lowest First), then Alphabetical
                students.sort((a, b) => {
                    if (b.lockedInMins !== a.lockedInMins) return b.lockedInMins - a.lockedInMins;
                    if (a.switches !== b.switches) return a.switches - b.switches;
                    return (a.name || "").localeCompare(b.name || "");
                });

                students.forEach(student => {
                    const isAway = student.status === 'away';
                    const bgClass = isAway ? 'bg-red-950/30 border-red-900/50' : 'bg-zinc-800 border-zinc-700';
                    const iconClass = isAway ? 'fa-moon text-red-400' : 'fa-check-circle text-green-500';
                    
                    let penaltyBadge = '';
                    if (student.switches > 0) {
                        penaltyBadge = `<span class="bg-red-900 text-white text-[10px] font-bold px-1.5 py-0.5 rounded mx-2" title="Tab Focus Lost">Breaks: ${student.switches}</span>`;
                    }

                    const progressPct = Math.min((student.lockedInMins / 60) * 100, 100);
                    
                    let barColorClass = 'bg-green-500';
                    if (student.lockedInMins >= 10 && student.lockedInMins < 20) barColorClass = 'bg-blue-500';
                    else if (student.lockedInMins >= 20 && student.lockedInMins < 30) barColorClass = 'bg-purple-500';
                    else if (student.lockedInMins >= 30 && student.lockedInMins < 40) barColorClass = 'bg-yellow-500';
                    else if (student.lockedInMins >= 40 && student.lockedInMins < 50) barColorClass = 'bg-orange-500';
                    else if (student.lockedInMins >= 50) barColorClass = 'bg-red-500';

                    let breakLinesHtml = '';
                    if (student.switches > 0) {
                        const numBreaksToDraw = Math.min(student.switches, 25);
                        for (let i = 1; i <= numBreaksToDraw; i++) {
                            const leftPos = (i / (numBreaksToDraw + 1)) * 100;
                            breakLinesHtml += `<div class="break-line" style="left: ${leftPos}%"></div>`;
                        }
                    }

                    const card = document.createElement('div');
                    card.className = `p-2 rounded-lg border ${bgClass} transition-colors flex flex-col gap-1`;
                    card.innerHTML = `
                        <div class="flex justify-between items-center w-full whitespace-nowrap overflow-hidden">
                            <div class="font-bold text-sm text-zinc-100 flex items-center shrink-0">
                                <i class="fa-solid ${iconClass} mr-2 text-[10px]"></i>
                                ${student.name || "Unknown"}
                                ${penaltyBadge}
                            </div>
                            <div class="text-[10px] text-zinc-400 font-mono tracking-tight shrink-0 mr-2">
                                ${student.lockedInMins}m / 60m
                            </div>
                            <div class="text-xs text-zinc-400 truncate w-full text-right font-normal pl-2 border-l border-zinc-700">
                                <i class="fa-solid fa-music mr-1 text-indigo-400"></i> ${student.song || "No song selected"}
                            </div>
                        </div>
                        <div class="w-full bg-zinc-950 rounded-full h-1.5 border border-zinc-800 overflow-hidden relative group mt-0.5" title="Locked-In Score: ${student.lockedInMins} mins">
                            <div class="h-full ${barColorClass} transition-all duration-1000 ease-linear relative" style="width: ${progressPct}%">
                                ${breakLinesHtml}
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }
    </script>
</body>
</html>
