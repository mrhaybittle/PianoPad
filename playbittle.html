<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheet Music Reader Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- ABCjs (ABC notation) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-basic-min.js"></script>
    <!-- PDF.js (PDF rendering) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- OpenSheetMusicDisplay (MusicXML) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/opensheetmusicdisplay/1.8.6/opensheetmusicdisplay.min.js"></script>
    <!-- SortableJS (Drag & Drop Rearranging) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .paper-canvas {
            width: 100%;
            min-height: 100%;
            background-color: #ffffff;
            transition: transform 0.15s ease-out;
            transform-origin: top center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .sheet-page {
            width: 100%;
            max-width: 1200px;
            background: #fff;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            border: 1px solid #e2e8f0;
        }

        /* Auto stretch SVG / Images */
        .sheet-page svg, .sheet-page img {
            width: 100% !important;
            height: auto !important;
            display: block;
        }

        .abcjs-highlight { fill: #2563eb !important; stroke: #1d4ed8 !important; }
        .abcjs-cursor { stroke: #dc2626; stroke-width: 2.5px; }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Thumbnails in sidebar */
        .sortable-ghost { opacity: 0.4; }
        .sortable-drag { cursor: grabbing !important; }
        .page-thumb-container { cursor: grab; }
        .page-thumb-container:active { cursor: grabbing; }
    </style>
</head>
<body class="h-full flex flex-col antialiased text-slate-800 bg-slate-50">

    <!-- Header Toolbar -->
    <header class="w-full bg-slate-900 text-slate-100 px-4 py-2 shadow-md border-b border-slate-800 flex-none z-30">
        <div class="w-full flex flex-wrap items-center justify-between gap-2 text-sm">
            
            <!-- Left: Controls -->
            <div class="flex items-center gap-2">
                <div class="flex items-center gap-2 font-bold text-white text-base mr-2">
                    <i data-lucide="music-4" class="w-5 h-5 text-blue-400"></i>
                    <span class="hidden sm:inline">SheetReader Pro</span>
                </div>
                
                <!-- Open File -->
                <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-medium flex items-center gap-1.5 transition-colors">
                    <i data-lucide="folder-plus" class="w-3.5 h-3.5 text-blue-400"></i>
                    <span class="hidden md:inline">Import</span>
                    <input type="file" id="fileInput" accept=".abc,.txt,.pdf,image/*,.xml,.mxl,.musicxml" multiple class="hidden" />
                </label>

                <!-- Camera/Scan -->
                <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-medium flex items-center gap-1.5 transition-colors">
                    <i data-lucide="camera" class="w-3.5 h-3.5 text-emerald-400"></i>
                    <span class="hidden md:inline">Scan</span>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" />
                </label>

                <button id="btnToggleEditor" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-medium flex items-center gap-1.5 transition-colors" title="Toggle ABC Code Editor">
                    <i data-lucide="code" class="w-3.5 h-3.5 text-indigo-400"></i>
                </button>
            </div>

            <!-- Center: Audio Playback (ABC only currently) -->
            <div class="flex items-center gap-2 bg-slate-950/80 px-3 py-1 rounded-xl border border-slate-800">
                <button id="btnPlay" class="bg-blue-600 hover:bg-blue-500 text-white p-2 rounded-full transition-all disabled:opacity-40 shadow-sm" disabled>
                    <i id="playIcon" data-lucide="play" class="w-4 h-4 fill-current"></i>
                </button>
                <button id="btnStop" class="text-slate-400 hover:text-white p-1.5 rounded-lg disabled:opacity-30" disabled>
                    <i data-lucide="square" class="w-4 h-4"></i>
                </button>
                <div class="h-4 w-px bg-slate-800"></div>
                <div class="flex items-center gap-2">
                    <i data-lucide="gauge" class="w-4 h-4 text-slate-400"></i>
                    <input type="range" id="tempoSlider" min="40" max="240" value="120" class="w-16 md:w-24 accent-blue-500 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer">
                    <span id="bpmDisplay" class="text-xs font-mono w-14 text-slate-300">120 BPM</span>
                </div>
            </div>

            <!-- Right: Zoom, Pages, Clear -->
            <div class="flex items-center gap-1 sm:gap-2">
                <div class="flex items-center bg-slate-800 rounded-lg p-0.5 border border-slate-700">
                    <button id="btnZoomOut" class="p-1.5 text-slate-300 hover:text-white hover:bg-slate-700 rounded transition-colors"><i data-lucide="minus" class="w-3.5 h-3.5"></i></button>
                    <span id="zoomDisplay" class="text-xs font-mono text-slate-300 px-2 min-w-[3rem] text-center">100%</span>
                    <button id="btnZoomIn" class="p-1.5 text-slate-300 hover:text-white hover:bg-slate-700 rounded transition-colors"><i data-lucide="plus" class="w-3.5 h-3.5"></i></button>
                    <button id="btnFit" class="px-2 py-1 text-slate-300 hover:text-white hover:bg-slate-700 rounded text-xs font-medium border-l border-slate-700">Reset</button>
                </div>

                <button id="btnTogglePages" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-medium flex items-center gap-1.5 transition-colors">
                    <i data-lucide="gallery-vertical-end" class="w-3.5 h-3.5 text-amber-400"></i>
                    <span class="hidden lg:inline">Pages</span>
                </button>

                <button id="btnClear" class="p-1.5 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded-lg transition-colors" title="Clear All">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 w-full relative flex overflow-hidden bg-slate-100">
        
        <!-- Left: ABC Editor Drawer -->
        <div id="editorDrawer" class="hidden absolute left-0 top-0 bottom-0 w-80 md:w-96 bg-slate-900 border-r border-slate-800 z-20 flex flex-col shadow-2xl transition-all">
            <div class="p-3 bg-slate-950 border-b border-slate-800 flex items-center justify-between text-xs font-semibold text-slate-300">
                <span class="flex items-center gap-1.5"><i data-lucide="file-code" class="w-4 h-4 text-blue-400"></i> ABC Editor</span>
                <button id="btnCloseEditor" class="text-slate-400 hover:text-white p-1 rounded"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <textarea id="abcEditorText" class="flex-1 w-full p-4 bg-slate-900 text-slate-100 font-mono text-xs focus:outline-none resize-none border-none" placeholder="Paste ABC code..."></textarea>
            <div class="p-3 border-t border-slate-800 bg-slate-950 flex justify-end">
                <button id="btnApplyAbc" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded-md">Add to Document</button>
            </div>
        </div>

        <!-- Right: Pages Manager Drawer -->
        <div id="pagesDrawer" class="hidden absolute right-0 top-0 bottom-0 w-64 bg-slate-900 border-l border-slate-800 z-20 flex flex-col shadow-2xl transition-all">
            <div class="p-3 bg-slate-950 border-b border-slate-800 flex items-center justify-between text-xs font-semibold text-slate-300">
                <span class="flex items-center gap-1.5"><i data-lucide="arrow-up-down" class="w-4 h-4 text-amber-400"></i> Rearrange Pages</span>
                <button id="btnClosePages" class="text-slate-400 hover:text-white p-1 rounded"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="p-2 text-xs text-slate-400 text-center border-b border-slate-800 bg-slate-900/50">Drag items below to reorder</div>
            <ul id="pagesList" class="flex-1 overflow-y-auto p-3 space-y-2 bg-slate-900">
                <!-- Thumbnails populate here -->
            </ul>
        </div>

        <!-- Document Viewer Area -->
        <main class="flex-1 w-full h-full overflow-y-auto overflow-x-hidden bg-slate-200/50 p-4 sm:p-8">
            <div id="paperWrapper" class="paper-canvas">
                
                <!-- Empty State -->
                <div id="dropZone" class="w-full max-w-2xl mt-12 border-2 border-dashed border-slate-300 rounded-2xl flex flex-col items-center justify-center p-12 text-center bg-white hover:bg-blue-50/50 transition-colors cursor-pointer">
                    <div class="flex gap-4 mb-6">
                        <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center shadow-sm"><i data-lucide="file-audio" class="w-6 h-6"></i></div>
                        <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center shadow-sm"><i data-lucide="file-image" class="w-6 h-6"></i></div>
                        <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center shadow-sm"><i data-lucide="camera" class="w-6 h-6"></i></div>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800 mb-2">Build Your Setlist</h2>
                    <p class="text-sm text-slate-500 max-w-md mb-2 leading-relaxed">
                        Drag & Drop or Import:<br>
                        <strong>PDFs, MusicXML, ABC notation, or Images.</strong><br>
                    </p>
                    <p class="text-xs text-slate-400 mb-6">You can append multiple files and rearrange pages later.</p>
                </div>

                <!-- Pages will be injected here as .sheet-page divs -->
            </div>
        </main>
    </div>

    <div id="audio-player" class="hidden"></div>

    <script>
        // Setup PDF.js Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Globals
        let currentScale = 1.0;
        let pagesData = []; // Array to store page metadata
        let osmdInstances = []; // Keep track of OSMD to resize
        
        // ABC Audio Globals (Links to the first ABC file found)
        let visualObj = null;
        let synthControl = null;
        let timingCallbacks = null;
        let isPlaying = false;
        let currentBpm = 120;

        // DOM
        const paperWrapper = document.getElementById('paperWrapper');
        const dropZone = document.getElementById('dropZone');
        const pagesList = document.getElementById('pagesList');
        
        // Init Lucide
        lucide.createIcons();

        // ---------------------------------------------------------
        // Core Engine: Add and Render Pages
        // ---------------------------------------------------------
        function generateId() {
            return 'page-' + Math.random().toString(36).substr(2, 9);
        }

        async function addPage(type, content, filename = "Unknown") {
            dropZone.classList.add('hidden');
            const pageId = generateId();
            
            const pageMeta = {
                id: pageId,
                type: type,
                content: content,
                filename: filename
            };
            pagesData.push(pageMeta);

            // 1. Create the Main Viewer Container
            const pageDiv = document.createElement('div');
            pageDiv.id = pageId;
            pageDiv.className = 'sheet-page p-2 sm:p-4 bg-white relative';
            paperWrapper.appendChild(pageDiv);

            // 2. Create the Thumbnail List Item
            const li = document.createElement('li');
            li.className = 'page-thumb-container bg-slate-800 p-2 rounded border border-slate-700 flex items-center gap-3 transition-colors hover:bg-slate-700';
            li.dataset.id = pageId;
            
            let iconStr = 'file';
            let iconColor = 'text-slate-400';
            if(type === 'image') { iconStr = 'image'; iconColor = 'text-rose-400'; }
            if(type === 'pdf') { iconStr = 'file-text'; iconColor = 'text-red-500'; }
            if(type === 'abc') { iconStr = 'music'; iconColor = 'text-blue-400'; }
            if(type === 'musicxml') { iconStr = 'music-4'; iconColor = 'text-emerald-400'; }

            li.innerHTML = `
                <i data-lucide="grip-vertical" class="w-4 h-4 text-slate-500"></i>
                <div class="w-8 h-8 rounded bg-slate-900 flex items-center justify-center shrink-0">
                    <i data-lucide="${iconStr}" class="w-4 h-4 ${iconColor}"></i>
                </div>
                <div class="flex-1 overflow-hidden">
                    <div class="text-xs text-slate-200 truncate font-medium">${filename}</div>
                    <div class="text-[10px] text-slate-500 uppercase">${type}</div>
                </div>
                <button onclick="removePage('${pageId}')" class="p-1 hover:text-red-400 text-slate-500 transition-colors"><i data-lucide="trash" class="w-3.5 h-3.5"></i></button>
            `;
            pagesList.appendChild(li);
            lucide.createIcons();

            // 3. Render Content inside Viewer Container
            if (type === 'image' || type === 'pdf') {
                const img = document.createElement('img');
                img.src = content;
                img.className = "w-full h-auto pointer-events-none";
                pageDiv.appendChild(img);
            } 
            else if (type === 'abc') {
                const abcContainer = document.createElement('div');
                abcContainer.id = `abc-${pageId}`;
                pageDiv.appendChild(abcContainer);
                
                let localVisualObj = ABCJS.renderAbc(abcContainer.id, content, {
                    responsive: 'resize', add_classes: true,
                    paddingtop: 10, paddingbottom: 20, paddingright: 10, paddingleft: 10
                })[0];

                // If this is the FIRST abc file, bind audio to it.
                if (!visualObj) {
                    visualObj = localVisualObj;
                    document.getElementById('btnPlay').disabled = false;
                    document.getElementById('btnStop').disabled = false;
                    
                    if (visualObj.metaText && visualObj.metaText.tempo && visualObj.metaText.tempo.bpm) {
                        currentBpm = visualObj.metaText.tempo.bpm;
                        document.getElementById('tempoSlider').value = currentBpm;
                        document.getElementById('bpmDisplay').textContent = `${currentBpm} BPM`;
                    }
                    setupAudio();
                }
            }
            else if (type === 'musicxml') {
                const osmdContainer = document.createElement('div');
                pageDiv.appendChild(osmdContainer);
                const osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(osmdContainer, {
                    autoResize: true,
                    backend: "svg",
                    drawTitle: true,
                });
                await osmd.load(content);
                osmd.render();
                osmdInstances.push(osmd);
            }
        }

        function removePage(id) {
            // Remove from DOM
            document.getElementById(id)?.remove();
            document.querySelector(`li[data-id="${id}"]`)?.remove();
            
            // Remove from array
            pagesData = pagesData.filter(p => p.id !== id);

            if (pagesData.length === 0) {
                dropZone.classList.remove('hidden');
                stopPlay();
                visualObj = null;
                document.getElementById('btnPlay').disabled = true;
                document.getElementById('btnStop').disabled = true;
            }
        }

        function clearAll() {
            paperWrapper.innerHTML = '';
            paperWrapper.appendChild(dropZone);
            pagesList.innerHTML = '';
            pagesData = [];
            osmdInstances = [];
            removePage('dummy'); // triggers cleanup
        }

        // ---------------------------------------------------------
        // Drag & Drop Sorting (SortableJS)
        // ---------------------------------------------------------
        new Sortable(pagesList, {
            animation: 150,
            ghostClass: 'sortable-ghost',
            onEnd: function (evt) {
                // Reorder standard DOM nodes in paperWrapper based on new list order
                const newOrderIds = Array.from(pagesList.children).map(li => li.dataset.id);
                newOrderIds.forEach(id => {
                    const pageDiv = document.getElementById(id);
                    if(pageDiv) paperWrapper.appendChild(pageDiv);
                });
            }
        });

        // ---------------------------------------------------------
        // File Handlers & Parsers
        // ---------------------------------------------------------
        async function processFile(file) {
            if (!file) return;
            const ext = file.name.split('.').pop().toLowerCase();
            
            if (['abc', 'txt'].includes(ext)) {
                const text = await file.text();
                addPage('abc', text, file.name);
            } 
            else if (['xml', 'mxl', 'musicxml'].includes(ext)) {
                const text = await file.text();
                addPage('musicxml', text, file.name);
            }
            else if (file.type === 'application/pdf' || ext === 'pdf') {
                const arrayBuffer = await file.arrayBuffer();
                await renderPdfToImages(arrayBuffer, file.name);
            }
            else if (file.type.startsWith('image/')) {
                const dataUrl = await readAsDataURL(file);
                addPage('image', dataUrl, file.name);
            }
        }

        function readAsDataURL(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        async function renderPdfToImages(arrayBuffer, filename) {
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 2.0 }); // High res
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                await addPage('pdf', dataUrl, `${filename} (Pg ${i})`);
            }
        }

        // ---------------------------------------------------------
        // Event Listeners (Inputs, Drag/Drop)
        // ---------------------------------------------------------
        document.getElementById('fileInput').addEventListener('change', (e) => {
            Array.from(e.target.files).forEach(processFile);
            e.target.value = ''; // Reset
        });

        document.getElementById('cameraInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                processFile(e.target.files[0]);
            }
            e.target.value = '';
        });

        // Dropzone & Window Drag Handling
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length > 0) {
                Array.from(e.dataTransfer.files).forEach(processFile);
            }
        });
        dropZone.addEventListener('click', () => document.getElementById('fileInput').click());

        // ---------------------------------------------------------
        // Toolbar UI & Zoom Controls
        // ---------------------------------------------------------
        function updateZoom() {
            paperWrapper.style.transform = `scale(${currentScale})`;
            document.getElementById('zoomDisplay').textContent = `${Math.round(currentScale * 100)}%`;
            // Trigger OSMD resize artificially if scaled heavily (optional, OSMD handles width natively better)
        }

        document.getElementById('btnZoomIn').addEventListener('click', () => { if (currentScale < 2.0) { currentScale += 0.1; updateZoom(); }});
        document.getElementById('btnZoomOut').addEventListener('click', () => { if (currentScale > 0.4) { currentScale -= 0.1; updateZoom(); }});
        document.getElementById('btnFit').addEventListener('click', () => { currentScale = 1.0; updateZoom(); });
        document.getElementById('btnClear').addEventListener('click', clearAll);

        // Drawers Toggles
        const editorDrawer = document.getElementById('editorDrawer');
        const pagesDrawer = document.getElementById('pagesDrawer');
        
        document.getElementById('btnToggleEditor').addEventListener('click', () => {
            editorDrawer.classList.remove('hidden');
            pagesDrawer.classList.add('hidden');
        });
        document.getElementById('btnCloseEditor').addEventListener('click', () => editorDrawer.classList.add('hidden'));
        document.getElementById('btnApplyAbc').addEventListener('click', () => {
            const text = document.getElementById('abcEditorText').value;
            if(text.trim()) addPage('abc', text, 'Pasted Code');
            editorDrawer.classList.add('hidden');
        });

        document.getElementById('btnTogglePages').addEventListener('click', () => {
            pagesDrawer.classList.remove('hidden');
            editorDrawer.classList.add('hidden');
        });
        document.getElementById('btnClosePages').addEventListener('click', () => pagesDrawer.classList.add('hidden'));

        // ---------------------------------------------------------
        // ABC Audio & Synth Logic (Fallback for ABC nodes)
        // ---------------------------------------------------------
        function setupAudio() {
            if (!ABCJS.synth.supportsAudio() || !visualObj) return;
            synthControl = new ABCJS.synth.SynthController();
            synthControl.load('#audio-player', { displayLoop: false, displayRestart: false, displayPlay: false, displayProgress: false });

            const createSynth = new ABCJS.synth.CreateSynth();
            createSynth.init({
                visualObj: visualObj,
                options: { midiBuffer: true, bpm: currentBpm }
            }).then(() => {
                synthControl.setTune(visualObj, false, { bpm: currentBpm });
            });
        }

        function togglePlay() {
            if (!visualObj) return;
            if (isPlaying) {
                stopPlay();
            } else {
                timingCallbacks = new ABCJS.TimingCallbacks(visualObj, {
                    eventCallback: function (ev) {
                        if (ev === null) { stopPlay(); return; }
                        clearHighlights();
                        if (ev.elements) {
                            ev.elements.forEach(elemArray => elemArray.forEach(elem => elem.classList.add('abcjs-highlight')));
                        }
                    },
                    bpm: currentBpm
                });

                ABCJS.synth.play().then(() => {
                    timingCallbacks.start();
                    isPlaying = true;
                    document.getElementById('playIcon').setAttribute('data-lucide', 'pause');
                    lucide.createIcons();
                });
            }
        }

        function stopPlay() {
            if(ABCJS.synth) ABCJS.synth.stop();
            if (timingCallbacks) timingCallbacks.stop();
            isPlaying = false;
            document.getElementById('playIcon').setAttribute('data-lucide', 'play');
            lucide.createIcons();
            clearHighlights();
        }

        function clearHighlights() {
            document.querySelectorAll('.abcjs-highlight').forEach(el => el.classList.remove('abcjs-highlight'));
        }

        document.getElementById('btnPlay').addEventListener('click', togglePlay);
        document.getElementById('btnStop').addEventListener('click', stopPlay);
        document.getElementById('tempoSlider').addEventListener('input', (e) => {
            currentBpm = parseInt(e.target.value, 10);
            document.getElementById('bpmDisplay').textContent = `${currentBpm} BPM`;
            if (visualObj && !isPlaying) setupAudio();
        });

    </script>
</body>
</html>
