<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrumPad - Rhythm & Notation Trainer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1f2937;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px 16px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .logo-svg {
            width: 42px;
            height: 42px;
        }

        .logo-title {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #1e293b 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .container {
            width: 100%;
            max-width: 1350px;
            height: calc(100vh - 70px);
            background-color: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: #f8fafc;
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .speed-control label {
            white-space: nowrap;
            color: #475569;
        }

        .speed-control input[type="range"] {
            width: 85px;
            accent-color: #2563eb;
            cursor: pointer;
        }

        select {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            color: #1e293b;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            outline: none;
        }

        #song-select {
            color: #d97706 !important;
            border: 2px solid #f59e0b !important;
            background-color: #fffbeb !important;
            font-weight: 700 !important;
            max-width: 250px;
        }

        button, .btn-file-label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            background-color: #3b82f6;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        button:hover, .btn-file-label:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:active, .btn-file-label:active {
            transform: translateY(0);
        }

        .btn-secondary { background-color: #64748b; }
        .btn-warning { background-color: #f59e0b; }
        .btn-success { background-color: #10b981; }
        .btn-danger { background-color: #ef4444; }
        .btn-midi { background-color: #06b6d4; }
        .btn-calib { background-color: #8b5cf6; }

        .btn-step { background-color: #ec4899 !important; font-weight: 700; }
        .btn-step-active { background-color: #be185d !important; box-shadow: 0 0 10px #ec4899; }
        .btn-game-active { background-color: #8b5cf6 !important; box-shadow: 0 0 12px #8b5cf6; font-weight: 700; }

        .icon {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .visualizer-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.03);
        }

        #sheet-canvas {
            background-color: #ffffff;
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- REALISTIC DRUM KIT LAYOUT --- */
        .drum-kit-layout-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background-color: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow-x: auto;
        }

        .drum-kit-stage {
            position: relative;
            width: 680px;
            height: 240px;
            margin: 0 auto;
        }

        .pad-node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #ffffff;
            border: 3.5px solid var(--pad-color);
            color: #1e293b;
            cursor: pointer;
            user-select: none;
            transition: all 0.08s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .pad-node.pedal-shape {
            border-radius: 20px 20px 8px 8px;
        }

        .pad-node.snare-center {
            z-index: 3;
            box-shadow: 0 6px 14px rgba(0,0,0,0.12);
        }

        .pad-node.active {
            background-color: var(--pad-color) !important;
            color: #ffffff !important;
            transform: translate(-50%, -50%) scale(0.93);
            box-shadow: 0 0 18px var(--pad-color);
        }

        .pad-node.pad-missed {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            box-shadow: 0 0 14px #ef4444;
        }

        .pad-node.step-target {
            animation: pulseTarget 0.8s infinite alternate ease-in-out;
            border-width: 4.5px;
        }

        @keyframes pulseTarget {
            0% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 6px var(--pad-color); }
            100% { transform: translate(-50%, -50%) scale(1.08); box-shadow: 0 0 22px var(--pad-color); }
        }

        .pad-node.active svg {
            stroke: #ffffff;
            fill: #ffffff;
        }

        .pad-svg {
            width: 24px;
            height: 24px;
            stroke: var(--pad-color);
            fill: none;
            stroke-width: 2;
        }

        .pad-title {
            font-size: 0.65rem;
            font-weight: 800;
            text-align: center;
            line-height: 1.1;
        }

        .pad-midi-code {
            font-size: 0.58rem;
            color: #64748b;
            margin-top: 1px;
        }

        .pad-node.active .pad-midi-code {
            color: #f1f5f9;
        }

        /* Drum Layout Positions (Matching Image) */
        #pad-openHiHat   { top: 52%; left: 10%; width: 88px; height: 88px; }
        #pad-closedHiHat { top: 52%; left: 10%; width: 88px; height: 88px; display: none; } /* Shares position with Open Hi-Hat */
        #pad-hiHatPedal  { top: 62%; left: 25%; width: 55px; height: 105px; transform: translate(-50%, -50%) rotate(-12deg); }
        #pad-snare        { top: 54%; left: 50%; width: 108px; height: 108px; }
        #pad-kick        { top: 62%; left: 68%; width: 55px; height: 105px; transform: translate(-50%, -50%) rotate(12deg); }
        #pad-floorTom    { top: 56%; left: 86%; width: 88px; height: 88px; }
        #pad-tom1        { top: 28%; left: 38%; width: 82px; height: 82px; }
        #pad-tom2        { top: 28%; left: 62%; width: 82px; height: 82px; }
        #pad-ride        { top: 24%; left: 82%; width: 92px; height: 92px; }

        /* Secondary Hi-Hat Overlay Toggle Box */
        .hihat-toggle-pill {
            position: absolute;
            top: 82%;
            left: 10%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 2px 4px;
            border-radius: 12px;
            z-index: 4;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .hihat-pill-btn {
            font-size: 0.58rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background: #f1f5f9;
            color: #475569;
        }

        .hihat-pill-btn.active {
            background: #2563eb;
            color: #ffffff;
        }

        .status-bar {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            text-align: center;
            min-height: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f1f5f9;
            border-radius: 6px;
            padding: 4px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.open { opacity: 1; pointer-events: auto; }

        .modal {
            background: #ffffff;
            border-radius: 16px;
            width: 90%; max-width: 520px;
            padding: 24px;
            display: flex; flex-direction: column; gap: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal h2 { font-size: 1.25rem; color: #0f172a; }

        .calib-step-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            border: 2px dashed #cbd5e1;
        }

        .calib-step-box svg {
            width: 60px; height: 60px;
            stroke: #2563eb; fill: none; stroke-width: 2;
        }

        .bar-chart-wrapper {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            height: 160px;
            width: 90px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 8px;
            margin: 10px auto;
        }

        .stacked-bar {
            width: 45px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-part-red { background-color: #ef4444; width: 100%; transition: height 0.4s ease; }
        .bar-part-orange { background-color: #f97316; width: 100%; transition: height 0.4s ease; }
        .bar-part-green { background-color: #22c55e; width: 100%; transition: height 0.4s ease; }
    </style>
</head>
<body>

    <div class="logo-container">
        <svg class="logo-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="28" stroke="#2563eb" stroke-width="5" fill="#eff6ff"/>
            <path d="M18 26L32 18L46 26" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
            <circle cx="22" cy="38" r="6" fill="#f59e0b"/>
            <circle cx="42" cy="38" r="6" fill="#10b981"/>
            <path d="M20 20L44 44M44 20L20 44" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div class="logo-title">DrumPad</div>
    </div>

    <div class="container">
        <header>
            <div class="controls">
                <select id="song-select">
                    <optgroup label="--- BEGINNER SECTION ---">
                        <option value="Beginner #1 - Individual Kit Parts">Beginner #1 - Individual Kit Parts</option>
                        <option value="Beginner #2 - 2-Part Combinations">Beginner #2 - 2-Part Combinations</option>
                        <option value="Beginner #3 - Very Basic Drum Beat">Beginner #3 - Very Basic Drum Beat</option>
                    </optgroup>
                    <optgroup label="--- DRUM GROOVES ---">
                        <option value="1. Standard Money Rock Beat">1. Standard Money Rock Beat</option>
                        <option value="2. Four-On-The-Floor Disco">2. Four-On-The-Floor Disco</option>
                        <option value="3. Offbeat Kick Groove">3. Offbeat Kick Groove</option>
                        <option value="4. Pop Backbeat Syncopation">4. Pop Backbeat Syncopation</option>
                        <option value="5. Half-Time Heavy Rock Beat">5. Half-Time Heavy Rock Beat</option>
                        <option value="6. 16th-Note Alternating Hi-Hat">6. 16th-Note Alternating Hi-Hat</option>
                        <option value="7. Open Hi-Hat Groove">7. Open Hi-Hat Groove</option>
                        <option value="8. Ride Cymbal Rock Fill">8. Ride Cymbal Rock Fill</option>
                        <option value="9. Funk Ghost-Note Groove">9. Funk Ghost-Note Groove</option>
                        <option value="10. Motown Soul Rhythm">10. Motown Soul Rhythm</option>
                        <option value="11. Four-Bar Rock Drive">11. Four-Bar Rock Drive</option>
                        <option value="12. Double-Kick Bounce Beat">12. Double-Kick Bounce Beat</option>
                        <option value="13. Slow Blues Shuffle">13. Slow Blues Shuffle</option>
                    </optgroup>
                </select>

                <div class="speed-control">
                    <label for="speed-slider">Tempo: <span id="speed-label">100 BPM</span></label>
                    <input type="range" id="speed-slider" min="40" max="240" value="100" step="2">
                </div>

                <button id="btn-game" class="btn-secondary">Game Mode: OFF</button>
                <button id="btn-step" class="btn-step">Step Mode</button>

                <button id="btn-calib-start" class="btn-calib">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"></path></svg>
                    Calibrate Kit MIDI
                </button>

                <label class="btn-file-label btn-midi">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                    Import MIDI
                    <input type="file" id="midi-input" accept=".mid,.midi" style="display: none;">
                </label>

                <button id="btn-play" class="btn-success">Play</button>
                <button id="btn-pause" class="btn-warning">Pause</button>
                <button id="btn-stop" class="btn-danger">Stop</button>
            </div>
        </header>

        <div class="visualizer-wrapper">
            <canvas id="sheet-canvas"></canvas>
        </div>

        <div class="drum-kit-layout-wrapper">
            <div class="drum-kit-stage" id="drum-stage">
                <div class="hihat-toggle-pill">
                    <button class="hihat-pill-btn active" id="pill-open">OPEN</button>
                    <button class="hihat-pill-btn" id="pill-closed">CLOSED</button>
                </div>
            </div>
        </div>

        <div class="status-bar" id="status">Welcome to DrumPad! Select a pattern or strike drums to play.</div>
    </div>

    <div class="modal-overlay" id="calib-modal">
        <div class="modal">
            <h2>Calibrate Drum Kit MIDI</h2>
            <p style="font-size: 0.85rem; color: #64748b;">Strike the corresponding trigger on your electronic drum kit to map its MIDI signal.</p>
            
            <div class="calib-step-box">
                <div id="calib-icon-wrapper"></div>
                <div id="calib-target-name" style="font-size: 1.2rem; font-weight: 800; color: #1e293b;">Kick Drum</div>
                <div style="font-size: 0.8rem; color: #0284c7; font-weight: 600;">Waiting for MIDI Input Signal...</div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span id="calib-progress" style="font-size: 0.8rem; font-weight: 700; color: #64748b;">Part 1 of 9</span>
                <button class="btn-secondary" id="btn-calib-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="game-results-modal">
        <div class="modal" style="text-align: center;">
            <h2>Game Performance Summary</h2>
            <p id="game-summary-text" style="font-size: 0.95rem; color: #334155; font-weight: 600;"></p>
            
            <div class="bar-chart-wrapper">
                <div class="stacked-bar">
                    <div id="bar-red" class="bar-part-red"></div>
                    <div id="bar-orange" class="bar-part-orange"></div>
                    <div id="bar-green" class="bar-part-green"></div>
                </div>
            </div>

            <div style="display: flex; justify-content: center; gap: 14px; font-size: 0.78rem; font-weight: 600;">
                <span style="color: #22c55e;">● Perfect</span>
                <span style="color: #f97316;">● Early/Late</span>
                <span style="color: #ef4444;">● Missed</span>
            </div>

            <div style="display: flex; justify-content: center; gap: 10px; margin-top: 10px;">
                <button class="btn-success" id="btn-game-results-close">Continue Practice</button>
            </div>
        </div>
    </div>

    <script>
        const DRUM_KIT = [
            { id: 'kick', name: 'KICK', color: '#e11d48', lineIndex: 0, head: 'note', midi: 36, isPedal: true, svg: '<ellipse cx="12" cy="12" rx="8" ry="5" fill="none"/>' },
            { id: 'floorTom', name: 'TOM 3', color: '#ea580c', lineIndex: 1, head: 'note', midi: 43, isPedal: false, svg: '<rect x="6" y="8" width="20" height="16" rx="2" fill="none"/>' },
            { id: 'tom2', name: 'TOM 2', color: '#d97706', lineIndex: 2, head: 'note', midi: 47, isPedal: false, svg: '<rect x="8" y="10" width="16" height="12" rx="2" fill="none"/>' },
            { id: 'tom1', name: 'TOM 1', color: '#ca8a04', lineIndex: 3, head: 'note', midi: 48, isPedal: false, svg: '<rect x="10" y="12" width="12" height="10" rx="2" fill="none"/>' },
            { id: 'snare', name: 'SNARE', color: '#16a34a', lineIndex: 3.5, head: 'note', midi: 38, isPedal: false, isSnare: true, svg: '<rect x="6" y="12" width="20" height="8" rx="1" fill="none"/><path d="M4 16h24"/>' },
            { id: 'ride', name: 'RIDE', color: '#0284c7', lineIndex: 4, head: 'diamond', midi: 51, isPedal: false, svg: '<ellipse cx="16" cy="16" rx="14" ry="4" fill="none"/>' },
            { id: 'closedHiHat', name: 'CLOSED HH', color: '#2563eb', lineIndex: 5, head: 'cross', midi: 42, isPedal: false, svg: '<ellipse cx="16" cy="12" rx="10" ry="3" fill="none"/><ellipse cx="16" cy="18" rx="10" ry="3" fill="none"/>' },
            { id: 'openHiHat', name: 'OPEN HH', color: '#7c3aed', lineIndex: 5, head: 'circleCross', midi: 46, isPedal: false, svg: '<ellipse cx="16" cy="10" rx="10" ry="3" fill="none"/><ellipse cx="16" cy="20" rx="10" ry="3" fill="none"/>' },
            { id: 'hiHatPedal', name: 'OPEN/CLOSE', color: '#db2777', lineIndex: -1, head: 'crossStem', midi: 44, isPedal: true, svg: '<path d="M8 24l16-8v8H8z"/>' }
        ];

        const ONE_BAR_PATTERNS = {
            "Beginner #1 - Individual Kit Parts": [
                [0, 'kick'], [500, 'snare'], [1000, 'closedHiHat'], [1500, 'openHiHat'],
                [2000, 'tom1'], [2500, 'tom2'], [3000, 'floorTom'], [3500, 'ride']
            ],
            "Beginner #2 - 2-Part Combinations": [
                [0, 'kick'], [0, 'closedHiHat'], [500, 'closedHiHat'],
                [1000, 'snare'], [1000, 'closedHiHat'], [1500, 'closedHiHat']
            ],
            "Beginner #3 - Very Basic Drum Beat": [
                [0, 'kick'], [0, 'closedHiHat'], [500, 'closedHiHat'],
                [1000, 'snare'], [1000, 'closedHiHat'], [1500, 'closedHiHat']
            ],
            "1. Standard Money Rock Beat": [
                [0, 'kick'], [0, 'closedHiHat'], [250, 'closedHiHat'], [500, 'snare'], [500, 'closedHiHat'],
                [750, 'closedHiHat'], [1000, 'kick'], [1000, 'closedHiHat'], [1250, 'closedHiHat'],
                [1500, 'snare'], [1500, 'closedHiHat'], [1750, 'closedHiHat']
            ],
            "2. Four-On-The-Floor Disco": [
                [0, 'kick'], [0, 'openHiHat'], [250, 'closedHiHat'], [500, 'kick'], [500, 'snare'], [500, 'openHiHat'],
                [750, 'closedHiHat'], [1000, 'kick'], [1000, 'openHiHat'], [1250, 'closedHiHat'],
                [1500, 'kick'], [1500, 'snare'], [1500, 'openHiHat'], [1750, 'closedHiHat']
            ],
            "3. Offbeat Kick Groove": [
                [0, 'kick'], [0, 'closedHiHat'], [250, 'closedHiHat'], [500, 'snare'], [500, 'closedHiHat'],
                [750, 'kick'], [750, 'closedHiHat'], [1000, 'closedHiHat'], [1250, 'closedHiHat'],
                [1500, 'snare'], [1500, 'closedHiHat'], [1750, 'closedHiHat']
            ],
            "4. Pop Backbeat Syncopation": [
                [0, 'kick'], [0, 'closedHiHat'], [250, 'closedHiHat'], [500, 'snare'], [500, 'closedHiHat'],
                [750, 'closedHiHat'], [1000, 'closedHiHat'], [1250, 'kick'], [1250, 'closedHiHat'],
                [1500, 'snare'], [1500, 'closedHiHat'], [1750, 'closedHiHat']
            ],
            "5. Half-Time Heavy Rock Beat": [
                [0, 'kick'], [0, 'closedHiHat'], [250, 'closedHiHat'], [500, 'closedHiHat'], [750, 'closedHiHat'],
                [1000, 'snare'], [1000, 'closedHiHat'], [1250, 'closedHiHat'], [1500, 'kick'], [1500, 'closedHiHat'],
                [1750, 'closedHiHat']
            ],
            "6. 16th-Note Alternating Hi-Hat": [
                [0, 'kick'], [0, 'closedHiHat'], [125, 'closedHiHat'], [250, 'closedHiHat'], [375, 'closedHiHat'],
                [500, 'snare'], [500, 'closedHiHat'], [625, 'closedHiHat'], [750, 'closedHiHat'], [875, 'closedHiHat'],
                [1000, 'kick'], [1000, 'closedHiHat'], [1125, 'closedHiHat'], [1250, 'closedHiHat'], [1375, 'closedHiHat'],
                [1500, 'snare'], [1500, 'closedHiHat'], [1625, 'closedHiHat'], [1750, 'closedHiHat'], [1875, 'closedHiHat']
            ],
            "7. Open Hi-Hat Groove": [
                [0, 'kick'], [0, 'closedHiHat'], [250, 'openHiHat'], [500, 'snare'], [500, 'closedHiHat'],
                [750, 'openHiHat'], [1000, 'kick'], [1000, 'closedHiHat'], [1250, 'openHiHat'],
                [1500, 'snare'], [1500, 'closedHiHat'], [1750, 'openHiHat']
            ],
            "8. Ride Cymbal Rock Fill": [
                [0, 'kick'], [0, 'ride'], [250, 'ride'], [500, 'snare'], [500, 'ride'], [750, 'ride'],
                [1000, 'tom1'], [1250, 'tom2'], [1500, 'floorTom'], [1750, 'kick'], [1750, 'snare']
            ],
            "9. Funk Ghost-Note Groove": [
                [0, 'kick'], [0, 'closedHiHat'], [250, 'closedHiHat'], [375, 'snare'], [500, 'snare'], [500, 'closedHiHat'],
                [750, 'kick'], [750, 'closedHiHat'], [1000, 'closedHiHat'], [1125, 'kick'], [1250, 'closedHiHat'],
                [1500, 'snare'], [1500, 'closedHiHat'], [1750, 'closedHiHat']
            ],
            "10. Motown Soul Rhythm": [
                [0, 'kick'], [0, 'closedHiHat'], [250, 'closedHiHat'], [500, 'snare'], [500, 'closedHiHat'],
                [750, 'snare'], [750, 'closedHiHat'], [1000, 'kick'], [1000, 'closedHiHat'], [1250, 'closedHiHat'],
                [1500, 'snare'], [1500, 'closedHiHat'], [1750, 'snare'], [1750, 'closedHiHat']
            ],
            "11. Four-Bar Rock Drive": [
                [0, 'kick'], [0, 'closedHiHat'], [250, 'kick'], [250, 'closedHiHat'], [500, 'snare'], [500, 'closedHiHat'],
                [750, 'closedHiHat'], [1000, 'kick'], [1000, 'closedHiHat'], [1250, 'closedHiHat'],
                [1500, 'snare'], [1500, 'closedHiHat'], [1750, 'kick'], [1750, 'closedHiHat']
            ],
            "12. Double-Kick Bounce Beat": [
                [0, 'kick'], [0, 'closedHiHat'], [125, 'kick'], [250, 'closedHiHat'], [500, 'snare'], [500, 'closedHiHat'],
                [750, 'closedHiHat'], [1000, 'kick'], [1000, 'closedHiHat'], [1125, 'kick'], [1250, 'closedHiHat'],
                [1500, 'snare'], [1500, 'closedHiHat'], [1750, 'closedHiHat']
            ],
            "13. Slow Blues Shuffle": [
                [0, 'kick'], [0, 'ride'], [166, 'ride'], [333, 'ride'], [500, 'snare'], [500, 'ride'],
                [666, 'ride'], [833, 'ride'], [1000, 'kick'], [1000, 'ride'], [1166, 'ride'],
                [1333, 'ride'], [1500, 'snare'], [1500, 'ride'], [1666, 'ride'], [1833, 'ride']
            ]
        };

        function generate16BarPattern(basePattern) {
            let fullSequence = [];
            let patternLengthMs = 2000;
            if (basePattern === ONE_BAR_PATTERNS["Beginner #1 - Individual Kit Parts"]) patternLengthMs = 4000;

            const repeatCount = Math.ceil(32000 / patternLengthMs);

            for (let rep = 0; rep < repeatCount; rep++) {
                const repOffset = rep * patternLengthMs;
                basePattern.forEach(hit => {
                    fullSequence.push({
                        timeMs: hit[0] + repOffset,
                        drumId: hit[1],
                        played: false,
                        gameStatus: 'pending'
                    });
                });
            }
            return fullSequence;
        }

        let audioCtx = null;
        let midiMapping = {};
        let activeSongTimeline = [];
        let isPlaying = false, isPaused = false, isStepMode = false, isGameMode = false;
        let currentBPM = 100;
        let speedFactor = 1.0;
        let playbackStartTime = 0, pauseStartTime = 0, accumulatedPauseMs = 0;
        let animationFrameId = null;
        let currentStepIndex = 0;
        let countInTimer = null;
        let activeHiHatMode = 'open'; // 'open' or 'closed'
        
        let gameStats = { perfect: 0, earlyLate: 0, miss: 0 };
        let isCalibrating = false;
        let calibIndex = 0;

        const canvas = document.getElementById('sheet-canvas');
        const ctx = canvas.getContext('2d');
        const speedSlider = document.getElementById('speed-slider');
        const speedLabel = document.getElementById('speed-label');
        const songSelect = document.getElementById('song-select');
        const statusEl = document.getElementById('status');

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function triggerMetronomeClick(isAccent = false) {
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(isAccent ? 1200 : 800, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.03);

            gain.gain.setValueAtTime(0.6, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);

            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.03);
        }

        function playErrorClackSound() {
            initAudio();
            const now = audioCtx.currentTime;
            const bufferSize = audioCtx.sampleRate * 0.04;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass'; filter.frequency.setValueAtTime(320, now);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

            noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            noise.start(now); noise.stop(now + 0.04);
        }

        function triggerDrumSound(drumId) {
            initAudio();
            const now = audioCtx.currentTime;

            if (drumId === 'kick') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(130, now);
                osc.frequency.exponentialRampToValueAtTime(35, now + 0.12);
                gain.gain.setValueAtTime(1.0, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.14);
            } else if (drumId === 'snare') {
                const bufferSize = audioCtx.sampleRate * 0.15;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.7, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                noise.connect(gain); gain.connect(audioCtx.destination);
                noise.start(now);
            } else if (drumId.includes('Tom')) {
                const pitchMap = { floorTom: 90, tom2: 120, tom1: 150 };
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const freq = pitchMap[drumId] || 110;
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.5, now + 0.2);
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.2);
            } else {
                const bufferSize = audioCtx.sampleRate * (drumId === 'openHiHat' || drumId === 'ride' ? 0.35 : 0.08);
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'highpass'; filter.frequency.value = 6000;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + bufferSize / audioCtx.sampleRate);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start(now);
            }
        }

        // --- RENDER STAGE DRUM SET LAYOUT (MATCHING IMAGE) ---
        function buildDrumPads() {
            const stage = document.getElementById('drum-stage');
            // Remove existing pads while keeping toggle pill
            stage.querySelectorAll('.pad-node').forEach(p => p.remove());

            DRUM_KIT.forEach(drum => {
                midiMapping[drum.midi] = drum.id;

                const pad = document.createElement('div');
                pad.className = 'pad-node';
                if (drum.isPedal) pad.classList.add('pedal-shape');
                if (drum.isSnare) pad.classList.add('snare-center');

                pad.id = `pad-${drum.id}`;
                pad.style.setProperty('--pad-color', drum.color);
                pad.innerHTML = `
                    <svg class="pad-svg" viewBox="0 0 32 32">${drum.svg}</svg>
                    <div class="pad-title">${drum.name}</div>
                    <div class="pad-midi-code">MIDI ${drum.midi}</div>
                `;
                pad.addEventListener('mousedown', () => triggerPadHit(drum.id));
                stage.appendChild(pad);
            });

            // Set default Hi-Hat visibility
            updateHiHatPillDisplay('open');
        }

        function setHiHatActiveMode(mode) {
            activeHiHatMode = mode;
            document.getElementById('pill-open').classList.toggle('active', mode === 'open');
            document.getElementById('pill-closed').classList.toggle('active', mode === 'closed');

            const openPad = document.getElementById('pad-openHiHat');
            const closedPad = document.getElementById('pad-closedHiHat');

            if (mode === 'open') {
                if (openPad) openPad.style.display = 'flex';
                if (closedPad) closedPad.style.display = 'none';
            } else {
                if (openPad) openPad.style.display = 'none';
                if (closedPad) closedPad.style.display = 'flex';
            }
        }

        function updateHiHatPillDisplay(mode) {
            setHiHatActiveMode(mode);
        }

        document.getElementById('pill-open').addEventListener('click', () => setHiHatActiveMode('open'));
        document.getElementById('pill-closed').addEventListener('click', () => setHiHatActiveMode('closed'));

        function updateGameStatus() {
            const total = gameStats.perfect + gameStats.earlyLate + gameStats.miss;
            const accuracy = total > 0 ? (((gameStats.perfect * 1.0 + gameStats.earlyLate * 0.5) / total) * 100).toFixed(1) : '100.0';
            statusEl.textContent = `Accuracy: ${accuracy}% | Perfect: ${gameStats.perfect} | Early/Late: ${gameStats.earlyLate} | Missed: ${gameStats.miss}`;
        }

        function triggerPadHit(drumId) {
            triggerDrumSound(drumId);

            // Auto-swap Hi-Hat visible pad if the other state is hit
            if (drumId === 'closedHiHat') setHiHatActiveMode('closed');
            if (drumId === 'openHiHat') setHiHatActiveMode('open');

            const pad = document.getElementById(`pad-${drumId}`);
            if (pad) {
                pad.classList.add('active');
                setTimeout(() => pad.classList.remove('active'), 120);
            }

            if (isCalibrating) return;

            if (isStepMode && isPlaying) {
                const target = activeSongTimeline[currentStepIndex];
                if (target && target.drumId === drumId) {
                    advanceStep();
                }
            } else if (isGameMode && isPlaying && !isPaused) {
                const effectiveElapsed = (performance.now() - playbackStartTime) - accumulatedPauseMs;
                
                const target = activeSongTimeline.find(n => 
                    n.drumId === drumId &&
                    n.gameStatus === 'pending' &&
                    Math.abs((n.timeMs / speedFactor) - effectiveElapsed) <= 300
                );

                if (target) {
                    const diff = Math.abs((target.timeMs / speedFactor) - effectiveElapsed);
                    if (diff <= 120) {
                        target.gameStatus = 'perfect';
                        gameStats.perfect++;
                    } else {
                        target.gameStatus = 'earlyLate';
                        gameStats.earlyLate++;
                    }
                    updateGameStatus();
                } else {
                    playErrorClackSound();
                    if (pad) {
                        pad.classList.add('pad-missed');
                        setTimeout(() => pad.classList.remove('pad-missed'), 200);
                    }
                }
            }
        }

        function initMIDI() {
            if (navigator.requestMIDIAccess) {
                navigator.requestMIDIAccess().then(access => {
                    for (let input of access.inputs.values()) {
                        input.onmidimessage = handleMIDIMessage;
                    }
                });
            }
        }

        function handleMIDIMessage(e) {
            const status = e.data[0];
            const command = status & 0xF0;
            const note = e.data[1];
            const velocity = e.data.length > 2 ? e.data[2] : 0;

            if (command === 144 && velocity > 0) {
                if (isCalibrating) {
                    processCalibrationMIDI(note);
                } else {
                    const mappedDrumId = midiMapping[note];
                    if (mappedDrumId) triggerPadHit(mappedDrumId);
                }
            }
        }

        function startCalibration() {
            isCalibrating = true;
            calibIndex = 0;
            document.getElementById('calib-modal').classList.add('open');
            updateCalibStepUI();
        }

        function updateCalibStepUI() {
            const drum = DRUM_KIT[calibIndex];
            document.getElementById('calib-target-name').textContent = drum.name;
            document.getElementById('calib-target-name').style.color = drum.color;
            document.getElementById('calib-icon-wrapper').innerHTML = `
                <svg viewBox="0 0 32 32" style="width:64px; height:64px; stroke:${drum.color}; fill:none; stroke-width:2;">${drum.svg}</svg>
            `;
            document.getElementById('calib-progress').textContent = `Part ${calibIndex + 1} of ${DRUM_KIT.length}`;
        }

        function processCalibrationMIDI(rawMidiNote) {
            const currentDrum = DRUM_KIT[calibIndex];
            midiMapping[rawMidiNote] = currentDrum.id;
            triggerDrumSound(currentDrum.id);

            calibIndex++;
            if (calibIndex < DRUM_KIT.length) {
                updateCalibStepUI();
            } else {
                isCalibrating = false;
                document.getElementById('calib-modal').classList.remove('open');
                statusEl.textContent = "Kit Calibration Complete! All drum parts mapped successfully.";
            }
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function drawNotationHead(ctx, x, y, headType, color) {
            ctx.save();
            ctx.fillStyle = color;
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;

            if (headType === 'note') {
                ctx.beginPath();
                ctx.ellipse(x, y, 6.5, 5, -0.2, 0, Math.PI * 2);
                ctx.fill();
            } else if (headType === 'diamond') {
                ctx.beginPath();
                ctx.moveTo(x, y - 6); ctx.lineTo(x + 7, y); ctx.lineTo(x, y + 6); ctx.lineTo(x - 7, y);
                ctx.closePath(); ctx.fill();
            } else if (headType === 'cross' || headType === 'crossStem') {
                ctx.beginPath();
                ctx.moveTo(x - 5, y - 5); ctx.lineTo(x + 5, y + 5);
                ctx.moveTo(x + 5, y - 5); ctx.lineTo(x - 5, y + 5);
                ctx.stroke();
            } else if (headType === 'circleCross') {
                ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x - 4, y - 4); ctx.lineTo(x + 4, y + 4);
                ctx.moveTo(x + 4, y - 4); ctx.lineTo(x - 4, y + 4);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawSheetMusic(elapsedMs) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerY = canvas.height / 2;
            const lineSpacing = 14;
            const hitLineX = 140;

            // 1. Staff Lines
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5;
            for (let i = -2; i <= 2; i++) {
                const y = centerY + i * lineSpacing;
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // 2. Measure Lines
            const pixelsPerMs = 0.35 * speedFactor;
            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2;
            for (let bar = 0; bar <= 16; bar++) {
                const barX = hitLineX + ((bar * 2000) / speedFactor - elapsedMs) * pixelsPerMs;
                if (barX > 30 && barX < canvas.width + 50) {
                    ctx.beginPath(); ctx.moveTo(barX, centerY - 2 * lineSpacing); ctx.lineTo(barX, centerY + 2 * lineSpacing); ctx.stroke();
                }
            }

            // 3. Percussion Clef
            ctx.fillStyle = '#334155';
            ctx.fillRect(40, centerY - 2 * lineSpacing, 4, lineSpacing * 4);
            ctx.fillRect(48, centerY - 2 * lineSpacing, 4, lineSpacing * 4);

            // 4. Hit Line Target
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(hitLineX, centerY - 3.5 * lineSpacing); ctx.lineTo(hitLineX, centerY + 3.5 * lineSpacing); ctx.stroke();

            // 5. Render Notes with Instant Feedback
            activeSongTimeline.forEach(note => {
                const drum = DRUM_KIT.find(d => d.id === note.drumId);
                if (!drum) return;

                const timeDelta = note.timeMs / speedFactor - elapsedMs;
                const noteX = hitLineX + timeDelta * pixelsPerMs;

                if (noteX > 30 && noteX < canvas.width + 20) {
                    let noteY = centerY - (drum.lineIndex - 2.5) * lineSpacing;
                    if (drum.lineIndex === -1) noteY = centerY + 3 * lineSpacing;

                    let noteColor = drum.color;
                    if (isGameMode) {
                        if (note.gameStatus === 'perfect') noteColor = '#22c55e';
                        else if (note.gameStatus === 'earlyLate') noteColor = '#f97316';
                        else if (note.gameStatus === 'miss') noteColor = '#ef4444';
                    }

                    ctx.strokeStyle = noteColor; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(noteX + 5, noteY); ctx.lineTo(noteX + 5, noteY - 28); ctx.stroke();

                    drawNotationHead(ctx, noteX, noteY, drum.head, noteColor);
                }
            });
        }

        function renderLoop(now) {
            if (!isPlaying || isPaused) return;

            let effectiveElapsed = 0;
            if (isStepMode) {
                effectiveElapsed = activeSongTimeline[currentStepIndex] ? activeSongTimeline[currentStepIndex].timeMs / speedFactor : 0;
            } else {
                effectiveElapsed = (now - playbackStartTime) - accumulatedPauseMs;
            }

            if (isGameMode) {
                activeSongTimeline.forEach(n => {
                    if (n.gameStatus === 'pending' && effectiveElapsed > (n.timeMs / speedFactor) + 250) {
                        n.gameStatus = 'miss';
                        gameStats.miss++;
                        updateGameStatus();

                        const pad = document.getElementById(`pad-${n.drumId}`);
                        if (pad) {
                            pad.classList.add('pad-missed');
                            setTimeout(() => pad.classList.remove('pad-missed'), 180);
                        }
                    }
                });
            } else if (!isStepMode) {
                activeSongTimeline.forEach(n => {
                    if (!n.played && effectiveElapsed >= n.timeMs / speedFactor) {
                        n.played = true;
                        triggerPadHit(n.drumId);
                    }
                });
            }

            drawSheetMusic(effectiveElapsed);

            const lastNote = activeSongTimeline[activeSongTimeline.length - 1];
            if (lastNote && effectiveElapsed > (lastNote.timeMs / speedFactor) + 1200) {
                if (isGameMode) showGameResultsPopUp();
                stopBeat();
                return;
            }

            animationFrameId = requestAnimationFrame(renderLoop);
        }

        function startCountInThenPlay() {
            initAudio();
            stopBeat();

            const beatIntervalMs = (60 / currentBPM) * 1000;
            let beatCount = 1;

            statusEl.textContent = `Get Ready! Count-In: ${beatCount}`;
            triggerMetronomeClick(true);

            countInTimer = setInterval(() => {
                beatCount++;
                if (beatCount <= 4) {
                    statusEl.textContent = `Get Ready! Count-In: ${beatCount}`;
                    triggerMetronomeClick(false);
                } else {
                    clearInterval(countInTimer);
                    countInTimer = null;
                    startActualPlayback();
                }
            }, beatIntervalMs);
        }

        function startActualPlayback() {
            isPlaying = true; isPaused = false;
            playbackStartTime = performance.now();
            accumulatedPauseMs = 0;
            currentStepIndex = 0;
            gameStats = { perfect: 0, earlyLate: 0, miss: 0 };

            activeSongTimeline.forEach(n => { n.played = false; n.gameStatus = 'pending'; });

            if (isGameMode) {
                updateGameStatus();
            } else {
                statusEl.textContent = `Playing Groove at ${currentBPM} BPM...`;
            }

            animationFrameId = requestAnimationFrame(renderLoop);
        }

        function playBeat() {
            if (activeSongTimeline.length === 0) return;
            startCountInThenPlay();
        }

        function stopBeat() {
            if (countInTimer) {
                clearInterval(countInTimer);
                countInTimer = null;
            }
            isPlaying = false; isPaused = false;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            drawSheetMusic(0);
            statusEl.textContent = "Playback stopped.";
        }

        function showGameResultsPopUp() {
            const totalHits = gameStats.perfect + gameStats.earlyLate + gameStats.miss;
            const accuracy = totalHits > 0 ? (((gameStats.perfect * 1.0 + gameStats.earlyLate * 0.5) / totalHits) * 100).toFixed(1) : '0.0';

            document.getElementById('game-summary-text').innerHTML = `Final Score: <span style="color:#22c55e;">${accuracy}%</span><br><span style="font-size:0.8rem; color:#64748b;">(${gameStats.perfect} Perfect, ${gameStats.earlyLate} Early/Late, ${gameStats.miss} Missed)</span>`;

            const greenPct = totalHits > 0 ? (gameStats.perfect / totalHits) * 100 : 0;
            const orangePct = totalHits > 0 ? (gameStats.earlyLate / totalHits) * 100 : 0;
            const redPct = totalHits > 0 ? (gameStats.miss / totalHits) * 100 : 0;

            document.getElementById('bar-green').style.height = `${greenPct}%`;
            document.getElementById('bar-orange').style.height = `${orangePct}%`;
            document.getElementById('bar-red').style.height = `${redPct}%`;

            document.getElementById('game-results-modal').classList.add('open');
        }

        document.getElementById('btn-game').addEventListener('click', () => {
            isGameMode = !isGameMode;
            const btn = document.getElementById('btn-game');
            if (isGameMode) {
                btn.textContent = 'Game Mode: ON';
                btn.classList.add('btn-game-active');
                if (isStepMode) {
                    isStepMode = false;
                    document.getElementById('btn-step').classList.remove('btn-step-active');
                }
                statusEl.textContent = "GAME MODE ACTIVE! Press Play for Count-In.";
            } else {
                btn.textContent = 'Game Mode: OFF';
                btn.classList.remove('btn-game-active');
                statusEl.textContent = "Game Mode OFF.";
            }
        });

        document.getElementById('btn-step').addEventListener('click', () => {
            isStepMode = !isStepMode;
            const btn = document.getElementById('btn-step');
            if (isStepMode) {
                btn.classList.add('btn-step-active');
                if (isGameMode) {
                    isGameMode = false;
                    document.getElementById('btn-game').textContent = 'Game Mode: OFF';
                    document.getElementById('btn-game').classList.remove('btn-game-active');
                }
            } else {
                btn.classList.remove('btn-step-active');
            }
        });

        document.getElementById('btn-play').addEventListener('click', playBeat);
        document.getElementById('btn-stop').addEventListener('click', stopBeat);
        document.getElementById('btn-pause').addEventListener('click', () => { isPaused = !isPaused; });
        document.getElementById('btn-calib-start').addEventListener('click', startCalibration);
        document.getElementById('btn-calib-cancel').addEventListener('click', () => {
            isCalibrating = false;
            document.getElementById('calib-modal').classList.remove('open');
        });
        document.getElementById('btn-game-results-close').addEventListener('click', () => {
            document.getElementById('game-results-modal').classList.remove('open');
        });

        speedSlider.addEventListener('input', () => {
            currentBPM = parseInt(speedSlider.value, 10);
            speedFactor = currentBPM / 100;
            speedLabel.textContent = `${currentBPM} BPM`;
        });

        songSelect.addEventListener('change', (e) => {
            const basePattern = ONE_BAR_PATTERNS[e.target.value];
            if (basePattern) {
                activeSongTimeline = generate16BarPattern(basePattern);
                playBeat();
            }
        });

        buildDrumPads();
        resizeCanvas();
        initMIDI();

        const defaultBeatKey = Object.keys(ONE_BAR_PATTERNS)[0];
        activeSongTimeline = generate16BarPattern(ONE_BAR_PATTERNS[defaultBeatKey]);
        songSelect.value = defaultBeatKey;

        drawSheetMusic(0);
    </script>
</body>
</html>
