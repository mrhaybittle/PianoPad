<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Octave Invasion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #050508;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 480px;
      height: 800px;
      background-color: #000;
      border: 4px solid #00ffcc;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #ui-bar {
      height: 40px;
      background: #0d0d15;
      border-bottom: 2px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      font-weight: bold;
      font-size: 12px;
      z-index: 10;
    }
    .ui-element {
      color: #00ffcc;
      text-shadow: 0 0 5px rgba(0, 255, 204, 0.5);
    }
    #canvas-container {
      position: relative;
      flex-grow: 1;
      width: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #keyboard-container {
      height: 120px;
      background: #111;
      border-top: 2px solid #333;
      position: relative;
      display: flex;
      justify-content: center;
      padding: 5px 0 0 0;
      z-index: 10;
    }
    .keyboard {
      display: flex;
      position: relative;
      height: 100px;
    }
    .key {
      border: 1px solid #000;
      border-radius: 0 0 4px 4px;
      cursor: pointer;
      box-sizing: border-box;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 5px;
      font-size: 9px;
      font-weight: bold;
    }
    .key.white {
      width: 30px;
      height: 100px;
      background: #fff;
      color: #333;
      z-index: 1;
    }
    .key.black {
      width: 20px;
      height: 60px;
      background: #000;
      color: #fff;
      margin-left: -10px;
      margin-right: -10px;
      z-index: 2;
      border: 1px solid #444;
    }
    .key.active {
      background: #00ffcc !important;
      color: #000 !important;
      box-shadow: 0 0 10px #00ffcc;
    }
    .popup-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      flex-direction: column;
    }
    .popup-card {
      background: #12121c;
      border: 2px solid #00ffcc;
      border-radius: 8px;
      padding: 20px;
      width: 80%;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
    }
    .popup-card h2 {
      color: #ff0055;
      margin-bottom: 12px;
      font-size: 18px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255, 0, 85, 0.6);
    }
    .popup-card p {
      color: #ccc;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 15px;
      text-align: center;
    }
    .popup-card button {
      background: #00ffcc;
      color: #000;
      border: none;
      padding: 8px 18px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      border-radius: 4px;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
    }
    .popup-card button:hover {
      background: #fff;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="ui-bar">
    <div class="ui-element">SCORE: <span id="score">0</span></div>
    <div class="ui-element">LIVES: <span id="lives">5</span></div>
    <div class="ui-element">STAGE: <span id="stage">1</span></div>
    <div class="ui-element">PWR: <span id="powerup-status">NONE</span></div>
  </div>

  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="keyboard-container">
    <div class="keyboard" id="visual-keyboard"></div>
  </div>

  <!-- Concise Instructions Modal -->
  <div id="instructions-modal" class="popup-overlay">
    <div class="popup-card">
      <h2 style="color: #00ffcc;">Controls</h2>
      <p>
        <b>LEFT:</b> High B<br>
        <b>RIGHT:</b> High C<br>
        <b>SHOOT:</b> Play Note<br>
        <b>CHORDS:</b> Power-Up<br>
        <b>LIVES:</b> 5 Ships
      </p>
      <button id="instructions-ok-btn">OK</button>
    </div>
  </div>

  <!-- Calibration Modal -->
  <div id="calibration-modal" class="popup-overlay hidden">
    <div class="popup-card">
      <h2 style="color: #00ffcc;">Calibrate</h2>
      <p id="calib-instructions">Press High B.</p>
      <div id="calib-progress" style="color: #ffaa00; font-weight: bold; margin-bottom: 15px;">1 / 2</div>
      <button id="skip-calib-btn">Skip</button>
    </div>
  </div>

  <!-- Malfunction Modal -->
  <div id="malfunction-modal" class="popup-overlay hidden">
    <div class="popup-card">
      <h2>Engine Malfunction!</h2>
      <p>Too Many Keys!</p>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="gameover-modal" class="popup-overlay hidden">
    <div class="popup-card">
      <h2>Game Over</h2>
      <p>Final Score: <span id="final-score">0</span></p>
      <button id="restart-btn">Retry</button>
    </div>
  </div>
</div>

<script>
  const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  
  const CHORDS = {
    "C Major": ["C", "E", "G"],
    "F Major": ["F", "A", "C"],
    "G Major": ["G", "B", "D"],
    "A Minor": ["A", "C", "E"],
    "D Minor": ["D", "F", "A"],
    "E Minor": ["E", "G", "B"]
  };

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  let score = 0;
  let stage = 1;
  let lives = 5;
  let activePowerup = null;
  let powerupTimer = 0;
  let engineDisabled = false;
  let activeNotes = new Set();
  
  let highestBNote = 83; // Default B5
  let highestCNote = 84; // Default C6
  let calibrationStep = 0;

  let moveLeft = false;
  let moveRight = false;

  let audioCtx = null;
  let isAudioInit = false;

  // Matrix Armada Setup (10 Cols x 4 Rows)
  const ARMADA_ROWS = 4;
  const ARMADA_COLS = 10;
  let armadaSlots = [];

  function initArmadaSlots() {
    armadaSlots = [];
    const startX = 50;
    const startY = 60;
    const spacingX = 38;
    const spacingY = 32;

    for (let r = 0; r < ARMADA_ROWS; r++) {
      for (let c = 0; c < ARMADA_COLS; c++) {
        armadaSlots.push({
          row: r,
          col: c,
          homeX: startX + c * spacingX,
          homeY: startY + r * spacingY,
          occupied: false,
          shipRef: null
        });
      }
    }
  }

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    isAudioInit = true;
  }

  function playLaserSound() {
    if (!isAudioInit) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
    
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  }

  function playExplosionSound() {
    if (!isAudioInit) return;
    const bufferSize = audioCtx.sampleRate * 0.2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(800, audioCtx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    noise.start();
  }

  // +1 Octave Staccato Arcade Loop
  let musicStep = 0;
  const cMajorHighScale = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50];
  const melodyPattern = [0, 2, 4, 7, 4, 2, 0, 4, 1, 3, 5, 7, 5, 3, 1, 5];

  function tickArcadeMusic() {
    if (!isAudioInit || !isRunning) return;
    
    if (frameCount % 5 === 0) {
      const freq = cMajorHighScale[melodyPattern[musicStep % melodyPattern.length]];
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      
      gain.gain.setValueAtTime(0.012, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.02);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.02);
      
      musicStep++;
    }
  }

  let player = { x: 0, y: 0, width: 32, height: 38, speed: 6, invulnerable: 0 };
  let bullets = [];
  let enemyBullets = [];
  let enemies = [];
  let powerupItems = [];
  let stars = [];
  let particles = [];

  const STAGE_RULES = {
    1: { notes: ["C", "G"], speed: 0.008, spawnInterval: 40, powerups: false },
    2: { notes: ["C", "C#", "G", "D"], speed: 0.011, spawnInterval: 30, powerups: true, chords: ["C Major", "F Major", "G Major"] },
    3: { notes: ["C", "C#", "D", "D#", "F#", "G", "A#"], speed: 0.014, spawnInterval: 22, powerups: true, chords: ["C Major", "F Major", "G Major", "A Minor", "D Minor", "E Minor"] }
  };

  function resizeCanvas() {
    const container = document.getElementById('canvas-container');
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
    player.x = canvas.width / 2 - player.width / 2;
    player.y = canvas.height - 50;
    initArmadaSlots();
  }

  function initStars() {
    stars = [];
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 2.5 + 0.5
      });
    }
  }

  function initVisualKeyboard() {
    const keyboardContainer = document.getElementById('visual-keyboard');
    keyboardContainer.innerHTML = '';
    
    [3, 4].forEach(octave => {
      NOTE_NAMES.forEach((note) => {
        const isBlack = note.includes('#');
        const keyEl = document.createElement('div');
        keyEl.className = `key ${isBlack ? 'black' : 'white'}`;
        keyEl.dataset.note = note;
        keyEl.innerText = isBlack ? '' : note;

        keyEl.addEventListener('mousedown', () => handleNoteOn(note));
        keyEl.addEventListener('mouseup', () => handleNoteOff(note));
        
        keyboardContainer.appendChild(keyEl);
      });
    });
  }

  function highlightKey(noteName, isActive) {
    const keys = document.querySelectorAll(`.key[data-note="${noteName}"]`);
    keys.forEach(key => {
      if (isActive) key.classList.add('active');
      else key.classList.remove('active');
    });
  }

  function initMIDI() {
    if (navigator.requestMIDIAccess) {
      navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);
    }
  }

  function onMIDISuccess(midiAccess) {
    const inputs = midiAccess.inputs.values();
    for (let input of inputs) {
      input.onmidimessage = handleMIDIMessage;
    }
  }

  function onMIDIFailure() {
    console.warn("MIDI access failed.");
  }

  function handleMIDIMessage(event) {
    initAudio();
    const [command, noteNumber, velocity] = event.data;
    const noteOn = command >= 144 && command <= 159 && velocity > 0;
    const noteOff = (command >= 128 && command <= 143) || (command >= 144 && command <= 159 && velocity === 0);

    if (calibrationStep < 2) {
      if (noteOn) processCalibration(noteNumber);
      return;
    }

    const noteName = NOTE_NAMES[noteNumber % 12];

    if (noteOn) {
      if (noteNumber === highestBNote) moveLeft = true;
      if (noteNumber === highestCNote) moveRight = true;

      if (noteNumber !== highestBNote && noteNumber !== highestCNote) {
        activeNotes.add(noteName);
        highlightKey(noteName, true);
        processInput();
      }
    } else if (noteOff) {
      if (noteNumber === highestBNote) moveLeft = false;
      if (noteNumber === highestCNote) moveRight = false;

      if (noteNumber !== highestBNote && noteNumber !== highestCNote) {
        activeNotes.delete(noteName);
        highlightKey(noteName, false);
      }
    }
  }

  document.getElementById('instructions-ok-btn').addEventListener('click', () => {
    document.getElementById('instructions-modal').classList.add('hidden');
    document.getElementById('calibration-modal').classList.remove('hidden');
  });

  function processCalibration(midiNote) {
    const instructions = document.getElementById('calib-instructions');
    const progress = document.getElementById('calib-progress');

    if (calibrationStep === 0) {
      highestBNote = midiNote;
      calibrationStep = 1;
      instructions.innerText = "Press High C.";
      progress.innerText = "2 / 2";
    } else if (calibrationStep === 1) {
      highestCNote = midiNote;
      calibrationStep = 2;
      document.getElementById('calibration-modal').classList.add('hidden');
      startGame();
    }
  }

  document.getElementById('skip-calib-btn').addEventListener('click', () => {
    initAudio();
    calibrationStep = 2;
    document.getElementById('calibration-modal').classList.add('hidden');
    startGame();
  });

  function handleNoteOn(noteName) {
    initAudio();
    if (calibrationStep < 2) return;
    activeNotes.add(noteName);
    highlightKey(noteName, true);
    processInput();
  }

  function handleNoteOff(noteName) {
    activeNotes.delete(noteName);
    highlightKey(noteName, false);
  }

  function processInput() {
    if (engineDisabled) return;

    const currentRules = STAGE_RULES[Math.min(stage, 3)];
    const powerupAvailable = currentRules.powerups && powerupItems.length > 0;
    const maxAllowedKeys = (powerupAvailable || activePowerup) ? 3 : 2;

    if (activeNotes.size > maxAllowedKeys) {
      triggerEngineMalfunction();
      return;
    }

    if (checkChordTrigger()) return;

    activeNotes.forEach(note => {
      shootBullet(note);
    });
  }

  function triggerEngineMalfunction() {
    engineDisabled = true;
    const modal = document.getElementById('malfunction-modal');
    modal.classList.remove('hidden');

    setTimeout(() => {
      modal.classList.add('hidden');
      engineDisabled = false;
      activeNotes.clear();
      document.querySelectorAll('.key').forEach(k => k.classList.remove('active'));
    }, 1800);
  }

  function checkChordTrigger() {
    const rules = STAGE_RULES[Math.min(stage, 3)];
    if (!rules.powerups) return false;

    for (let chordName of rules.chords) {
      const requiredNotes = CHORDS[chordName];
      const match = requiredNotes.every(n => activeNotes.has(n));

      if (match) {
        activePowerup = chordName;
        powerupTimer = 350;
        document.getElementById('powerup-status').innerText = chordName;
        powerupItems = powerupItems.filter(item => item.name !== chordName);
        return true;
      }
    }
    return false;
  }

  function shootBullet(noteName) {
    bullets.push({
      x: player.x + player.width / 2 - 3,
      y: player.y,
      width: 6,
      height: 14,
      note: noteName,
      speed: 10
    });
    playLaserSound();
  }

  function createExplosion(x, y, color) {
    for (let i = 0; i < 12; i++) {
      particles.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 7,
        vy: (Math.random() - 0.5) * 7,
        size: Math.random() * 3 + 1,
        color: color,
        life: 18
      });
    }
    playExplosionSound();
  }

  function loseLife() {
    if (player.invulnerable > 0) return;
    lives--;
    document.getElementById('lives').innerText = lives;
    createExplosion(player.x + player.width / 2, player.y + player.height / 2, '#00ffcc');

    if (lives <= 0) {
      gameOver();
    } else {
      player.invulnerable = 90;
      player.x = canvas.width / 2 - player.width / 2;
    }
  }

  let frameCount = 0;

  // Galaga Formation Entry & Armada Slot Management
  function spawnEnemyGroup() {
    const openSlots = armadaSlots.filter(s => !s.occupied);
    if (openSlots.length === 0) return;

    const targetSlot = openSlots[Math.floor(Math.random() * openSlots.length)];
    targetSlot.occupied = true;

    const rules = STAGE_RULES[Math.min(stage, 3)];
    const assignedNote = rules.notes[Math.floor(Math.random() * rules.notes.length)];
    
    // Side: 0 = Left (Clockwise loop), 1 = Right (Counter-clockwise loop)
    const side = Math.random() < 0.5 ? 'left' : 'right';

    const enemyObj = {
      state: 'entering', // 'entering' -> 'armada' -> 'diving'
      side: side,
      progress: 0,
      width: 28,
      height: 28,
      note: assignedNote,
      speed: rules.speed,
      targetSlot: targetSlot,
      x: 0,
      y: -40,
      diveTimer: Math.random() * 600 + 300,
      hasShot: false
    };

    targetSlot.shipRef = enemyObj;
    enemies.push(enemyObj);
  }

  function spawnPowerupItem() {
    const rules = STAGE_RULES[Math.min(stage, 3)];
    if (!rules.powerups || powerupItems.length > 0) return;

    const chordName = rules.chords[Math.floor(Math.random() * rules.chords.length)];
    powerupItems.push({
      x: Math.random() * (canvas.width - 80),
      y: -40,
      width: 80,
      height: 24,
      name: chordName,
      speed: 1.2
    });
  }

  function update() {
    frameCount++;
    const rules = STAGE_RULES[Math.min(stage, 3)];

    tickArcadeMusic();

    if (player.invulnerable > 0) player.invulnerable--;

    if (moveLeft && player.x > 0) {
      player.x -= player.speed;
    }
    if (moveRight && player.x < canvas.width - player.width) {
      player.x += player.speed;
    }

    if (frameCount % rules.spawnInterval === 0) spawnEnemyGroup();
    if (rules.powerups && frameCount % 350 === 0) spawnPowerupItem();

    if (score > stage * 150) {
      stage++;
      document.getElementById('stage').innerText = stage;
    }

    if (powerupTimer > 0) {
      powerupTimer--;
      if (powerupTimer === 0) {
        activePowerup = null;
        document.getElementById('powerup-status').innerText = "NONE";
      }
    }

    stars.forEach(s => {
      s.y += s.speed;
      if (s.y > canvas.height) s.y = 0;
    });

    particles.forEach((p, i) => {
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    });

    bullets.forEach((b, i) => {
      b.y -= b.speed;
      if (b.y < -15) bullets.splice(i, 1);
    });

    enemyBullets.forEach((eb, i) => {
      eb.y += eb.speed;

      if (
        eb.x < player.x + player.width &&
        eb.x + eb.width > player.x &&
        eb.y < player.y + player.height &&
        eb.y + eb.height > player.y
      ) {
        enemyBullets.splice(i, 1);
        loseLife();
      } else if (eb.y > canvas.height + 10) {
        enemyBullets.splice(i, 1);
      }
    });

    powerupItems.forEach((p, i) => {
      p.y += p.speed;
      if (p.y > canvas.height) powerupItems.splice(i, 1);
    });

    // Update Ships Motion & Loop-to-Line Entry
    enemies.forEach((e, ei) => {
      if (e.state === 'entering') {
        e.progress += e.speed;
        const t = e.progress;

        // Curve Down, Loop in Circle, and Merge into Armada Line
        if (t < 0.75) {
          const loopT = t / 0.75;
          if (e.side === 'left') {
            e.x = (canvas.width * 0.3) + Math.sin(loopT * Math.PI * 2) * 90 - Math.cos(loopT * Math.PI) * 30;
            e.y = -20 + (loopT * canvas.height * 0.5) - Math.sin(loopT * Math.PI * 2) * 60;
          } else {
            e.x = (canvas.width * 0.7) - Math.sin(loopT * Math.PI * 2) * 90 + Math.cos(loopT * Math.PI) * 30;
            e.y = -20 + (loopT * canvas.height * 0.5) - Math.sin(loopT * Math.PI * 2) * 60;
          }
        } else {
          // Transition into Armada Line Slot
          const mergeT = (t - 0.75) / 0.25;
          const endX = e.side === 'left' ? e.x : e.x;
          e.x = e.x + (e.targetSlot.homeX - e.x) * mergeT;
          e.y = e.y + (e.targetSlot.homeY - e.y) * mergeT;

          if (mergeT >= 1.0) {
            e.state = 'armada';
            e.x = e.targetSlot.homeX;
            e.y = e.targetSlot.homeY;
          }
        }
      } else if (e.state === 'armada') {
        // Subtle Armada Swaying
        e.x = e.targetSlot.homeX + Math.sin(frameCount * 0.03) * 12;
        e.y = e.targetSlot.homeY;

        // Randomly trigger Dive Attack
        e.diveTimer--;
        if (e.diveTimer <= 0) {
          e.state = 'diving';
          e.hasShot = false;
        }
      } else if (e.state === 'diving') {
        // Fast Swoop Dive Attack
        e.y += 4.5;
        e.x += Math.sin(e.y * 0.02) * 3;

        if (!e.hasShot && e.y > canvas.height * 0.4) {
          e.hasShot = true;
          enemyBullets.push({
            x: e.x + e.width / 2 - 2,
            y: e.y + e.height,
            width: 4,
            height: 12,
            speed: 6
          });
        }

        // Loop back up if missed player
        if (e.y > canvas.height + 20) {
          e.y = -30;
          e.state = 'entering';
          e.progress = 0.7;
        }
      }

      // Collision with Player
      if (
        e.x < player.x + player.width &&
        e.x + e.width > player.x &&
        e.y < player.y + player.height &&
        e.y + e.height > player.y
      ) {
        if (e.targetSlot) e.targetSlot.occupied = false;
        enemies.splice(ei, 1);
        loseLife();
        return;
      }

      // Player Bullet Hit Collision
      bullets.forEach((b, bi) => {
        if (
          b.x < e.x + e.width &&
          b.x + b.width > e.x &&
          b.y < e.y + e.height &&
          b.y + b.height > e.y
        ) {
          if (b.note === e.note || activePowerup) {
            createExplosion(e.x + e.width / 2, e.y + e.height / 2, e.note.includes('#') ? '#ff0055' : '#00ffcc');
            if (e.targetSlot) e.targetSlot.occupied = false;
            enemies.splice(ei, 1);
            bullets.splice(bi, 1);
            score += 10;
            document.getElementById('score').innerText = score;
          } else {
            bullets.splice(bi, 1);
          }
        }
      });
    });
  }

  function drawPlayerShip(x, y, w, h) {
    if (player.invulnerable % 10 > 5) return;

    ctx.save();
    ctx.translate(x + w / 2, y + h / 2);

    const thrustHeight = Math.random() * 8 + 6;
    ctx.fillStyle = "#ffaa00";
    ctx.beginPath();
    ctx.moveTo(-5, h / 2);
    ctx.lineTo(0, h / 2 + thrustHeight);
    ctx.lineTo(5, h / 2);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#1e3d59";
    ctx.beginPath();
    ctx.moveTo(0, -h / 2);
    ctx.lineTo(w / 2, h / 2);
    ctx.lineTo(-w / 2, h / 2);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#00ffcc";
    ctx.beginPath();
    ctx.moveTo(0, -h / 2 + 4);
    ctx.lineTo(w / 3, h / 2 - 4);
    ctx.lineTo(-w / 3, h / 2 - 4);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(0, -4, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ffffff";
    stars.forEach(s => {
      ctx.fillRect(s.x, s.y, s.size, s.size);
    });

    drawPlayerShip(player.x, player.y, player.width, player.height);

    particles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });

    bullets.forEach(b => {
      ctx.fillStyle = "#ffcc00";
      ctx.fillRect(b.x, b.y, b.width, b.height);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 9px Courier New";
      ctx.fillText(b.note, b.x - 2, b.y - 3);
    });

    enemyBullets.forEach(eb => {
      ctx.fillStyle = "#ff0044";
      ctx.fillRect(eb.x, eb.y, eb.width, eb.height);
    });

    enemies.forEach(e => {
      const isSharp = e.note.includes('#');
      ctx.fillStyle = isSharp ? '#ff0055' : '#bd00ff';
      
      ctx.beginPath();
      ctx.moveTo(e.x + e.width / 2, e.y + e.height);
      ctx.lineTo(e.x + e.width, e.y);
      ctx.lineTo(e.x + e.width * 0.75, e.y + e.height * 0.4);
      ctx.lineTo(e.x + e.width * 0.25, e.y + e.height * 0.4);
      ctx.lineTo(e.x, e.y);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 12px Courier New";
      ctx.textAlign = "center";
      ctx.fillText(e.note, e.x + e.width / 2, e.y + e.height / 2 + 3);
    });

    powerupItems.forEach(p => {
      ctx.strokeStyle = "#00ffcc";
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x, p.y, p.width, p.height);
      ctx.fillStyle = "rgba(0,255,204,0.15)";
      ctx.fillRect(p.x, p.y, p.width, p.height);

      ctx.fillStyle = "#00ffcc";
      ctx.font = "bold 10px Courier New";
      ctx.textAlign = "center";
      ctx.fillText(`CHORD: ${p.name}`, p.x + p.width / 2, p.y + 16);
    });
  }

  let animationFrameId;
  let isRunning = false;

  function gameLoop() {
    if (!isRunning) return;
    update();
    draw();
    animationFrameId = requestAnimationFrame(gameLoop);
  }

  function startGame() {
    score = 0;
    stage = 1;
    lives = 5;
    enemies = [];
    bullets = [];
    enemyBullets = [];
    powerupItems = [];
    particles = [];
    activePowerup = null;
    initArmadaSlots();
    document.getElementById('score').innerText = score;
    document.getElementById('stage').innerText = stage;
    document.getElementById('lives').innerText = lives;
    document.getElementById('powerup-status').innerText = "NONE";
    document.getElementById('gameover-modal').classList.add('hidden');
    isRunning = true;
    gameLoop();
  }

  function gameOver() {
    isRunning = false;
    cancelAnimationFrame(animationFrameId);
    document.getElementById('final-score').innerText = score;
    document.getElementById('gameover-modal').classList.remove('hidden');
  }

  document.getElementById('restart-btn').addEventListener('click', () => {
    initAudio();
    startGame();
  });

  window.addEventListener('load', () => {
    resizeCanvas();
    initStars();
    initVisualKeyboard();
    initMIDI();
  });

  window.addEventListener('resize', resizeCanvas);
</script>
</body>
</html>
