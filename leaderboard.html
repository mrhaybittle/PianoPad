<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PianoPad 26 - Global Leaderboard</title>
    <style>
        :root {
            --bg-color: #121218;
            --panel-bg: #1f1f2e;
            --accent-color: #ec4899;
            --accent-hover: #db2777;
            --arcade-color: #8b5cf6;
            --arcade-hover: #7c3aed;
            --text-main: #f3f4f6;
            --gold: #fbbf24;
            --silver: #cbd5e1;
            --bronze: #d97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 12px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background-color: var(--panel-bg);
            border-radius: 14px;
            box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.6);
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid #374151;
            padding-bottom: 12px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f3f4f6;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #374151;
            background-color: #0b0f19;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-back {
            background-color: #4f46e5;
            color: white;
        }
        .btn-back:hover { background-color: #6366f1; }

        .btn-arcade {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white;
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.4);
        }
        .btn-arcade:hover {
            background: linear-gradient(135deg, #7c3aed, #db2777);
        }

        .btn-song-mode {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        .btn-song-mode:hover {
            background: linear-gradient(135deg, #059669, #047857);
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #374151;
            background-color: #0b0f19;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #181f2e;
            color: #9ca3af;
            font-weight: 700;
            padding: 12px 16px;
            border-bottom: 1px solid #374151;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #1f2937;
            color: #e5e7eb;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #131b2e;
        }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: 800;
            font-size: 0.85rem;
            color: #000;
        }

        .rank-1 { background-color: var(--gold); box-shadow: 0 0 8px var(--gold); }
        .rank-2 { background-color: var(--silver); box-shadow: 0 0 8px var(--silver); }
        .rank-3 { background-color: var(--bronze); box-shadow: 0 0 8px var(--bronze); color: #fff; }
        .rank-other { background-color: transparent; color: #9ca3af; }

        .score-highlight {
            color: #22c55e;
            font-weight: 700;
        }

        .status-msg {
            text-align: center;
            color: #9ca3af;
            padding: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="leaderboard-title">🏆 PianoPad Song High Scores</h1>
            <div class="controls">
                <select id="filter-song">
                    <option value="ALL">All Songs</option>
                </select>
                <button id="btn-toggle-mode" class="btn btn-arcade">
                    🎮 MINI-GAME Leaderboard
                </button>
                <a href="index.html" class="btn btn-back">← Back to Player</a>
            </div>
        </header>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 70px;">Rank</th>
                        <th>Student Name</th>
                        <th id="col-header-title">Song Title</th>
                        <th id="col-header-score">Accuracy</th>
                        <th id="col-header-tempo">Tempo Speed</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr>
                        <td colspan="6" class="status-msg">Loading scores from Google Sheet...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const LEADERBOARD_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTah8Yo_iNb5PcmAjatGpwjPkFqVoLI4-TnJTLfSAQCR3uCuFzOI-XQia8LJ-Vq9E1ZXEX0MnOUWA2v/pub?gid=191904617&single=true&output=csv';

        const MINI_GAME_TITLES = [
            'simon taps',
            'mystery note',
            'drop dodge',
            'combo strike',
            'finger sprint',
            'two-note combo'
        ];

        let allScores = [];
        let viewMode = 'SONGS';

        function parseCSV(csvText) {
            const lines = csvText.split(/\r?\n/);
            const records = [];

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const row = [];
                let insideQuote = false;
                let entry = '';

                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"' && line[j + 1] === '"') {
                        entry += '"';
                        j++;
                    } else if (char === '"') {
                        insideQuote = !insideQuote;
                    } else if (char === ',' && !insideQuote) {
                        row.push(entry);
                        entry = '';
                    } else {
                        entry += char;
                    }
                }
                row.push(entry);

                if (row.length >= 4) {
                    const songTitle = row[2] ? row[2].trim().replace(/^"|"$/g, '') : 'Unknown';
                    const isMiniGame = MINI_GAME_TITLES.some(g => songTitle.toLowerCase().includes(g));

                    records.push({
                        timestamp: row[0] ? row[0].trim().replace(/^"|"$/g, '') : '',
                        name: row[1] ? row[1].trim().replace(/^"|"$/g, '') : 'Anonymous',
                        song: songTitle,
                        accuracy: parseFloat(row[3]) || 0,
                        speed: parseInt(row[4]) || 100,
                        isMiniGame: isMiniGame
                    });
                }
            }
            return records;
        }

        function populateSongFilter() {
            const filterSelect = document.getElementById('filter-song');
            
            const activePool = allScores.filter(s => viewMode === 'GAMES' ? s.isMiniGame : !s.isMiniGame);
            const uniqueTitles = [...new Set(activePool.map(s => s.song))];
            uniqueTitles.sort();

            const defaultLabel = viewMode === 'GAMES' ? 'All Mini-Games' : 'All Songs';
            filterSelect.innerHTML = `<option value="ALL">${defaultLabel}</option>`;
            
            uniqueTitles.forEach(title => {
                const opt = document.createElement('option');
                opt.value = title;
                opt.textContent = title;
                filterSelect.appendChild(opt);
            });
        }

        function renderLeaderboard() {
            const filterValue = document.getElementById('filter-song').value;
            const tbody = document.getElementById('leaderboard-body');

            let pool = allScores.filter(s => viewMode === 'GAMES' ? s.isMiniGame : !s.isMiniGame);

            let filtered = filterValue === 'ALL' 
                ? [...pool] 
                : pool.filter(s => s.song === filterValue);

            filtered.sort((a, b) => {
                if (b.accuracy !== a.accuracy) return b.accuracy - a.accuracy;
                return b.speed - a.speed;
            });

            if (filtered.length === 0) {
                const typeText = viewMode === 'GAMES' ? 'mini-game' : 'song';
                const colSpan = viewMode === 'GAMES' ? '5' : '6';
                tbody.innerHTML = `<tr><td colspan="${colSpan}" class="status-msg">No high scores found for this ${typeText}.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            filtered.forEach((item, index) => {
                const tr = document.createElement('tr');

                let rankBadge = `<span class="rank-badge rank-other">${index + 1}</span>`;
                if (index === 0) rankBadge = `<span class="rank-badge rank-1">1</span>`;
                else if (index === 1) rankBadge = `<span class="rank-badge rank-2">2</span>`;
                else if (index === 2) rankBadge = `<span class="rank-badge rank-3">3</span>`;

                let scoreFormatted = `${item.accuracy.toFixed(1)}%`;
                const titleLower = item.song.toLowerCase();

                if (titleLower.includes('simon taps')) {
                    scoreFormatted = `Level ${Math.round(item.accuracy)}`;
                } else if (titleLower.includes('mystery note')) {
                    scoreFormatted = `${Math.round(item.accuracy)} Guesses`;
                } else if (titleLower.includes('finger sprint')) {
                    scoreFormatted = `${item.accuracy.toFixed(2)}s`;
                }

                if (viewMode === 'GAMES') {
                    tr.innerHTML = `
                        <td>${rankBadge}</td>
                        <td style="font-weight: 600; color: #fff;">${item.name}</td>
                        <td>${item.song}</td>
                        <td class="score-highlight">${scoreFormatted}</td>
                        <td style="font-size: 0.8rem; color: #9ca3af;">${item.timestamp || 'N/A'}</td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td>${rankBadge}</td>
                        <td style="font-weight: 600; color: #fff;">${item.name}</td>
                        <td>${item.song}</td>
                        <td class="score-highlight">${scoreFormatted}</td>
                        <td>${item.speed}%</td>
                        <td style="font-size: 0.8rem; color: #9ca3af;">${item.timestamp || 'N/A'}</td>
                    `;
                }
                tbody.appendChild(tr);
            });
        }

        function toggleViewMode() {
            const toggleBtn = document.getElementById('btn-toggle-mode');
            const titleEl = document.getElementById('leaderboard-title');
            const colHeaderTitle = document.getElementById('col-header-title');
            const colHeaderScore = document.getElementById('col-header-score');
            const colHeaderTempo = document.getElementById('col-header-tempo');

            if (viewMode === 'SONGS') {
                viewMode = 'GAMES';
                titleEl.textContent = '🕹️ Mini-Game High Scores';
                colHeaderTitle.textContent = 'Mini-Game';
                colHeaderScore.textContent = 'Score / Level';
                colHeaderTempo.style.display = 'none';
                toggleBtn.textContent = '🎵 SONG Leaderboard';
                toggleBtn.className = 'btn btn-song-mode';
            } else {
                viewMode = 'SONGS';
                titleEl.textContent = '🏆 PianoPad Song High Scores';
                colHeaderTitle.textContent = 'Song Title';
                colHeaderScore.textContent = 'Accuracy';
                colHeaderTempo.style.display = '';
                toggleBtn.textContent = '🎮 MINI-GAME Leaderboard';
                toggleBtn.className = 'btn btn-arcade';
            }

            populateSongFilter();
            renderLeaderboard();
        }

        async function fetchScores() {
            try {
                const response = await fetch(LEADERBOARD_CSV_URL);
                if (!response.ok) throw new Error('Network response error');

                const csvText = await response.text();
                allScores = parseCSV(csvText);

                populateSongFilter();
                renderLeaderboard();
            } catch (err) {
                console.error(err);
                document.getElementById('leaderboard-body').innerHTML = 
                    '<tr><td colspan="6" class="status-msg" style="color:#ef4444;">Failed to load leaderboard data. Please ensure the CSV link is public.</td></tr>';
            }
        }

        document.getElementById('filter-song').addEventListener('change', renderLeaderboard);
        document.getElementById('btn-toggle-mode').addEventListener('click', toggleViewMode);

        fetchScores();
    </script>
</body>
</html>
