<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PianoPad 26 - Global Leaderboard</title>
    <style>
        :root {
            --bg-color: #121218;
            --panel-bg: #1f1f2e;
            --accent-color: #ec4899;
            --accent-hover: #db2777;
            --arcade-color: #8b5cf6;
            --arcade-hover: #7c3aed;
            --text-main: #f3f4f6;
            --gold: #fbbf24;
            --silver: #cbd5e1;
            --bronze: #d97706;
            --home-pink: #f472b6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 12px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background-color: var(--panel-bg);
            border-radius: 14px;
            box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.6);
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: max-width 0.3s ease;
        }

        .container.wide-mode {
            max-width: 1400px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid #374151;
            padding-bottom: 12px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f3f4f6;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            flex: 1;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #374151;
            background-color: #0b0f19;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-back {
            background-color: #4f46e5;
            color: white;
        }
        .btn-back:hover { background-color: #6366f1; }

        .btn-arcade {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white;
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.4);
        }
        .btn-arcade:hover {
            background: linear-gradient(135deg, #7c3aed, #db2777);
        }

        .btn-song-mode {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        .btn-song-mode:hover {
            background: linear-gradient(135deg, #059669, #047857);
        }

        .total-scores-chip {
            font-size: 0.85rem;
            font-weight: 700;
            color: #10b981;
            background: #0b0f19;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #374151;
            margin-left: auto;
            white-space: nowrap;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #374151;
            background-color: #0b0f19;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.88rem;
        }

        th {
            background-color: #181f2e;
            color: #9ca3af;
            font-weight: 700;
            padding: 12px 14px;
            border-bottom: 1px solid #374151;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        .sortable-col {
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }
        .sortable-col:hover {
            color: #f3f4f6;
        }

        td {
            padding: 10px 14px;
            border-bottom: 1px solid #1f2937;
            color: #e5e7eb;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #131b2e;
        }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-weight: 800;
            font-size: 0.78rem;
            color: #000;
        }

        .rank-1 { background-color: var(--gold); box-shadow: 0 0 8px var(--gold); }
        .rank-2 { background-color: var(--silver); box-shadow: 0 0 8px var(--silver); }
        .rank-3 { background-color: var(--bronze); box-shadow: 0 0 8px var(--bronze); color: #fff; }
        .rank-other { background-color: transparent; color: #9ca3af; }

        .score-highlight {
            color: #22c55e;
            font-weight: 700;
        }

        .status-msg {
            text-align: center;
            color: #9ca3af;
            padding: 20px;
            font-size: 0.9rem;
        }

        .arcade-dashboard {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            overflow-x: auto;
        }

        .arcade-column {
            background: #141226;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 230px;
        }

        .arcade-column-header {
            font-size: 0.95rem;
            font-weight: 800;
            color: #facc15;
            text-align: center;
            border-bottom: 1px solid #374151;
            padding-bottom: 8px;
        }

        .arcade-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            background: #0b0f19;
            border-radius: 6px;
            border: 1px solid #1f2937;
            font-size: 0.82rem;
        }

        .arcade-row-name {
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100px;
        }

        /* Home Entry Styling */
        .home-entry {
            color: var(--home-pink) !important;
            font-weight: 700;
        }

        .home-icon {
            margin-left: 4px;
            font-style: normal;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <header>
            <h1 id="leaderboard-title">🏆 PianoPad Song High Scores</h1>
            <div class="controls">
                <select id="filter-song">
                    <option value="ALL">All Songs</option>
                </select>
                <button type="button" id="btn-toggle-mode" class="btn btn-arcade">
                    🎮 MINI-GAME Leaderboard
                </button>
                <a href="index.html" class="btn btn-back">← Back to Player</a>
                <div id="total-scores-display" class="total-scores-chip">Leaderboard Scores = ...</div>
            </div>
        </header>

        <div id="view-content-area">
            <div class="table-wrapper" id="song-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 70px;">Rank</th>
                            <th style="width: 90px;">Position</th>
                            <th>Student Name</th>
                            <th>Song Title</th>
                            <th>Accuracy</th>
                            <th>Tempo Speed</th>
                            <th id="th-date-sort" class="sortable-col" title="Click to sort by date">Date <span id="date-sort-icon">↕️</span></th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <tr>
                            <td colspan="7" class="status-msg">Loading scores from Google Sheet...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="arcade-dashboard" id="arcade-dashboard" style="display: none;"></div>
        </div>
    </div>

    <script>
        const LEADERBOARD_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTah8Yo_iNb5PcmAjatGpwjPkFqVoLI4-TnJTLfSAQCR3uCuFzOI-XQia8LJ-Vq9E1ZXEX0MnOUWA2v/pub?gid=191904617&single=true&output=csv';

        const MINI_GAMES = [
            { key: 'simon taps', title: '🧠 Simon Taps', unit: 'Level', sortAsc: false },
            { key: 'mystery note', title: '🔍 Mystery Note', unit: 'Guesses', sortAsc: true },
            { key: 'drop dodge', title: '🛡️ Drop Dodge', unit: 'Dodges', sortAsc: false },
            { key: 'combo strike', title: '⚡ Combo Strike', unit: 'Score', sortAsc: false },
            { key: 'finger sprint', title: '🏃 Finger Sprint', unit: 'Seconds', sortAsc: true }
        ];

        let allScores = [];
        let viewMode = 'SONGS';
        let dateSortMode = 'DEFAULT'; 

        // Helper function to check if entry timestamp is between 2:05 PM and 8:15 AM
        function isOutsideSchoolHours(dateString) {
            if (!dateString) return false;
            const d = new Date(dateString);
            if (isNaN(d.getTime())) return false;

            const totalMinutes = d.getHours() * 60 + d.getMinutes();
            const startHomeMins = (14 * 60) + 5; // 2:05 PM = 845 minutes
            const endHomeMins = (8 * 60) + 15;   // 8:15 AM = 495 minutes

            return totalMinutes >= startHomeMins || totalMinutes < endHomeMins;
        }

        function parseCSV(csvText) {
            const lines = csvText.split(/\r?\n/);
            const records = [];

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const row = [];
                let insideQuote = false;
                let entry = '';

                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"' && line[j + 1] === '"') {
                        entry += '"';
                        j++;
                    } else if (char === '"') {
                        insideQuote = !insideQuote;
                    } else if (char === ',' && !insideQuote) {
                        row.push(entry);
                        entry = '';
                    } else {
                        entry += char;
                    }
                }
                row.push(entry);

                if (row.length >= 4) {
                    const accuracy = parseFloat(row[3]) || 0;
                    if (accuracy <= 0.0) continue; 

                    const songTitle = row[2] ? row[2].trim().replace(/^"|"$/g, '') : 'Unknown';
                    const isMiniGame = MINI_GAMES.some(g => songTitle.toLowerCase().includes(g.key));

                    records.push({
                        timestamp: row[0] ? row[0].trim().replace(/^"|"$/g, '') : '',
                        name: row[1] ? row[1].trim().replace(/^"|"$/g, '') : 'Anonymous',
                        song: songTitle,
                        accuracy: accuracy,
                        speed: parseInt(row[4]) || 100,
                        isMiniGame: isMiniGame
                    });
                }
            }
            return records;
        }

        function populateSongFilter() {
            const filterSelect = document.getElementById('filter-song');
            
            if (viewMode === 'GAMES') {
                filterSelect.style.display = 'none';
                return;
            }

            filterSelect.style.display = '';
            const activePool = allScores.filter(s => !s.isMiniGame);
            const uniqueTitles = [...new Set(activePool.map(s => s.song))];
            uniqueTitles.sort();

            filterSelect.innerHTML = `<option value="ALL">All Songs</option>`;
            uniqueTitles.forEach(title => {
                const opt = document.createElement('option');
                opt.value = title;
                opt.textContent = title;
                filterSelect.appendChild(opt);
            });
        }

        function isToday(dateString) {
            if (!dateString) return false;
            const d = new Date(dateString);
            if (isNaN(d.getTime())) return false;
            const today = new Date();
            return d.getDate() === today.getDate() &&
                   d.getMonth() === today.getMonth() &&
                   d.getFullYear() === today.getFullYear();
        }

        function renderSongLeaderboard() {
            const filterValue = document.getElementById('filter-song').value;
            const tbody = document.getElementById('leaderboard-body');

            let pool = allScores.filter(s => !s.isMiniGame);
            let filtered = filterValue === 'ALL' ? [...pool] : pool.filter(s => s.song === filterValue);

            if (dateSortMode === 'NEWEST') {
                filtered.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            } else if (dateSortMode === 'OLDEST') {
                filtered.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
            } else {
                filtered.sort((a, b) => {
                    if (b.accuracy !== a.accuracy) return b.accuracy - a.accuracy;
                    return b.speed - a.speed;
                });
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="status-msg">No high scores found for this song.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            filtered.forEach((item) => {
                const tr = document.createElement('tr');

                // Medal Logic
                let rankBadge = `<span class="rank-badge rank-other">${item.songRank}</span>`;
                if (item.songRank === 1) rankBadge = `<span class="rank-badge rank-1">🥇</span>`;
                else if (item.songRank === 2) rankBadge = `<span class="rank-badge rank-2">🥈</span>`;
                else if (item.songRank === 3) rankBadge = `<span class="rank-badge rank-3">🥉</span>`;

                let positionText = `${item.songRank}/${item.songTotal}`;
                let dateStyle = isToday(item.timestamp) ? 'font-weight: 700; color: #facc15;' : 'color: #9ca3af;';

                // Check for home / outside school hours
                const isHome = isOutsideSchoolHours(item.timestamp);
                const nameStyleClass = isHome ? 'home-entry' : '';
                const homeIcon = isHome ? ' <span class="home-icon" title="Achieved outside school hours">🏠</span>' : '';

                tr.innerHTML = `
                    <td>${rankBadge}</td>
                    <td style="font-weight: 700; color: #9ca3af;">${positionText}</td>
                    <td class="${nameStyleClass}" style="${!isHome ? 'font-weight: 600; color: #fff;' : ''}">${item.name}${homeIcon}</td>
                    <td>${item.song}</td>
                    <td class="score-highlight">${item.accuracy.toFixed(1)}%</td>
                    <td>${item.speed}%</td>
                    <td style="font-size: 0.8rem; ${dateStyle}">${item.timestamp || 'N/A'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderArcadeDashboard() {
            const dashboard = document.getElementById('arcade-dashboard');
            dashboard.innerHTML = '';

            MINI_GAMES.forEach(gameConfig => {
                const colDiv = document.createElement('div');
                colDiv.className = 'arcade-column';

                const header = document.createElement('div');
                header.className = 'arcade-column-header';
                header.textContent = gameConfig.title;
                colDiv.appendChild(header);

                let gameScores = allScores.filter(s => s.song.toLowerCase().includes(gameConfig.key));

                gameScores.sort((a, b) => {
                    return gameConfig.sortAsc ? a.accuracy - b.accuracy : b.accuracy - a.accuracy;
                });

                const topScores = gameScores.slice(0, 8);

                if (topScores.length === 0) {
                    const emptyMsg = document.createElement('div');
                    emptyMsg.className = 'status-msg';
                    emptyMsg.style.fontSize = '0.8rem';
                    emptyMsg.textContent = 'No scores yet!';
                    colDiv.appendChild(emptyMsg);
                } else {
                    topScores.forEach((score, idx) => {
                        const row = document.createElement('div');
                        row.className = 'arcade-row';

                        let badge = `<span class="rank-badge rank-other">${idx + 1}</span>`;
                        if (idx === 0) badge = `<span class="rank-badge rank-1">🥇</span>`;
                        else if (idx === 1) badge = `<span class="rank-badge rank-2">🥈</span>`;
                        else if (idx === 2) badge = `<span class="rank-badge rank-3">🥉</span>`;

                        let formattedVal = `${score.accuracy.toFixed(1)}%`;
                        if (gameConfig.key === 'simon taps') formattedVal = `Lvl ${Math.round(score.accuracy)}`;
                        else if (gameConfig.key === 'mystery note') formattedVal = `${Math.round(score.accuracy)} Guesses`;
                        else if (gameConfig.key === 'finger sprint') formattedVal = `${score.accuracy.toFixed(2)}s`;

                        // Check for home / outside school hours
                        const isHome = isOutsideSchoolHours(score.timestamp);
                        const nameStyleClass = isHome ? 'arcade-row-name home-entry' : 'arcade-row-name';
                        const homeIcon = isHome ? ' <span class="home-icon" title="Achieved outside school hours">🏠</span>' : '';

                        row.innerHTML = `
                            <div style="display:flex; align-items:center; gap:6px;">
                                ${badge}
                                <span class="${nameStyleClass}">${score.name}${homeIcon}</span>
                            </div>
                            <span class="score-highlight">${formattedVal}</span>
                        `;
                        colDiv.appendChild(row);
                    });
                }
                dashboard.appendChild(colDiv);
            });
        }

        function toggleViewMode() {
            const container = document.getElementById('main-container');
            const toggleBtn = document.getElementById('btn-toggle-mode');
            const titleEl = document.getElementById('leaderboard-title');
            const songTable = document.getElementById('song-table-wrapper');
            const arcadeDash = document.getElementById('arcade-dashboard');

            if (viewMode === 'SONGS') {
                viewMode = 'GAMES';
                container.classList.add('wide-mode');
                titleEl.textContent = '🕹️ Mini-Game Leaderboard Dashboard';
                songTable.style.display = 'none';
                arcadeDash.style.display = 'grid';
                toggleBtn.textContent = '🎵 SONG Leaderboard';
                toggleBtn.className = 'btn btn-song-mode';
                renderArcadeDashboard();
            } else {
                viewMode = 'SONGS';
                container.classList.remove('wide-mode');
                titleEl.textContent = '🏆 PianoPad Song High Scores';
                arcadeDash.style.display = 'none';
                songTable.style.display = '';
                toggleBtn.textContent = '🎮 MINI-GAME Leaderboard';
                toggleBtn.className = 'btn btn-arcade';
                renderSongLeaderboard();
            }

            populateSongFilter();
        }

        async function fetchScores() {
            try {
                const response = await fetch(LEADERBOARD_CSV_URL);
                if (!response.ok) throw new Error('Network response error');

                const csvText = await response.text();
                allScores = parseCSV(csvText);

                // Update Total Scores Label
                const totalDisplay = document.getElementById('total-scores-display');
                if (totalDisplay) {
                    totalDisplay.textContent = `Leaderboard Scores = ${allScores.length}`;
                }

                // Compute global rank and total entries per individual song
                let songRanks = {};
                allScores.filter(s => !s.isMiniGame).forEach(s => {
                    if (!songRanks[s.song]) songRanks[s.song] = [];
                    songRanks[s.song].push(s);
                });

                for (let song in songRanks) {
                    songRanks[song].sort((a, b) => {
                        if (b.accuracy !== a.accuracy) return b.accuracy - a.accuracy;
                        return b.speed - a.speed;
                    });
                    songRanks[song].forEach((s, idx) => {
                        s.songRank = idx + 1;
                        s.songTotal = songRanks[song].length;
                    });
                }

                populateSongFilter();
                renderSongLeaderboard();
            } catch (err) {
                console.error(err);
                document.getElementById('leaderboard-body').innerHTML = 
                    '<tr><td colspan="7" class="status-msg" style="color:#ef4444;">Failed to load leaderboard data. Please ensure the CSV link is public.</td></tr>';
            }
        }

        document.getElementById('filter-song').addEventListener('change', renderSongLeaderboard);
        document.getElementById('btn-toggle-mode').addEventListener('click', toggleViewMode);
        
        document.getElementById('th-date-sort').addEventListener('click', () => {
            const icon = document.getElementById('date-sort-icon');
            if (dateSortMode === 'DEFAULT') {
                dateSortMode = 'NEWEST';
                icon.textContent = '⬇️';
            } else if (dateSortMode === 'NEWEST') {
                dateSortMode = 'OLDEST';
                icon.textContent = '⬆️';
            } else {
                dateSortMode = 'DEFAULT';
                icon.textContent = '↕️';
            }
            renderSongLeaderboard();
        });

        fetchScores();
    </script>
</body>
</html>
