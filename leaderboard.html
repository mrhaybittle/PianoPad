        .container {

            padding: 20px 24px;

            flex-direction: column;
            gap: 16px;
            transition: max-width 0.3s ease;
        }

        .container.wide-mode {
            max-width: 1400px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid #374151;
            padding-bottom: 12px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f3f4f6;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            flex: 1;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #374151;
            background-color: #0b0f19;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .btn {

            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
            border: none;

        }

        .btn-back {

            color: white;
        }
        .btn-back:hover { background-color: #6366f1; }

        .btn-arcade {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);

            box-shadow: 0 0 10px rgba(236, 72, 153, 0.4);
        }
        .btn-arcade:hover {

            color: #10b981;
            background: #0b0f19;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #374151;
            margin-left: auto;

        .table-wrapper {

            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #374151;
            background-color: #0b0f19;
        }

        table {

        const DIFFICULTY_WEIGHT = { "Hard": 3, "Medium": 2, "Easy": 1, "Unknown": 0 };

        const MINI_GAMES = [
            { key: 'simon taps', title: '🧠 Simon Taps', unit: 'Level', sortAsc: false },
            { key: 'mystery note', title: '🔍 Mystery Note', unit: 'Guesses', sortAsc: true },
            { key: 'drop dodge', title: '🛡️ Drop Dodge', unit: 'Dodges', sortAsc: false },
            { key: 'combo strike', title: '⚡ Combo Strike', unit: 'Score', sortAsc: false },
            { key: 'finger sprint', title: '🏃 Finger Sprint', unit: 'Seconds', sortAsc: true }

        let allScores = [];
        let viewMode = 'SONGS';
        let dateSortMode = 'DEFAULT'; 

        function isOutsideSchoolHours(dateString) {
            if (!dateString) return false;
            const d = new Date(dateString);
            if (isNaN(d.getTime())) return false;

            const totalMinutes = d.getHours() * 60 + d.getMinutes();
            const startHomeMins = (14 * 60) + 5; // 2:05 PM = 845 minutes
            const endHomeMins = (8 * 60) + 15;   // 8:15 AM = 495 minutes

            return totalMinutes >= startHomeMins || totalMinutes < endHomeMins;
        }

        function parseCSVRow(line) {
            const row = [];
            let insideQuote = false;
            let entry = '';

            for (let j = 0; j < line.length; j++) {
                const char = line[j];
                if (char === '"' && line[j + 1] === '"') {
                    entry += '"';
                    j++;
                } else if (char === '"') {
                    insideQuote = !insideQuote;
                } else if (char === ',' && !insideQuote) {
                    row.push(entry);
                    entry = '';
                } else {
                    entry += char;
                }
            }
            row.push(entry);
            return row;
        }

        function parseCSV(csvText) {
            const lines = csvText.split(/\r?\n/);
            const records = [];

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const row = parseCSVRow(line);

                if (row.length >= 4) {
                    const accuracy = parseFloat(row[3]);
                    if (isNaN(accuracy)) continue;

                    const songTitle = row[2] ? row[2].trim().replace(/^"|"$/g, '') : 'Unknown';
                    const isMiniGame = MINI_GAMES.some(g => songTitle.toLowerCase().includes(g.key));

                    records.push({
                        timestamp: row[0] ? row[0].trim().replace(/^"|"$/g, '') : '',
                        name: row[1] ? row[1].trim().replace(/^"|"$/g, '') : 'Anonymous',
                        song: songTitle,
                        accuracy: accuracy,
                        speed: parseInt(row[4]) || 100,
                        isMiniGame: isMiniGame
                    });
                }
            }
            return records;
        }

        async function fetchLiveSongDifficulties() {
            try {
                let csvText = '';
                const cacheBuster = '&_t=' + Date.now();

                try {
                    const resDirect = await fetch(SONGLIST_DIRECT_CSV_URL + cacheBuster, { cache: 'no-store' });
                    if (resDirect.ok) csvText = await resDirect.text();
                    else throw new Error('Direct songlist export failed');
                } catch (e) {
                    const resPub = await fetch(SONGLIST_PUB_CSV_URL + cacheBuster, { cache: 'no-store' });
                    if (resPub.ok) csvText = await resPub.text();
                }

                if (csvText) {
                    const lines = csvText.split(/\r?\n/);
                    lines.forEach((line, index) => {
                        if (index === 0 || !line.trim()) return;
                        const row = parseCSVRow(line);
                        if (row.length >= 3) {
                            const title = row[0] ? row[0].trim().replace(/^"|"$/g, '') : '';
                            const diff = row[2] ? row[2].trim().replace(/^"|"$/g, '') : '';
                            if (title && diff) {
                                SONG_DIFFICULTIES[title] = diff;
                            }
                        }
                    });
                }
            } catch (err) {
                console.warn("Using fallback static song difficulties.", err);
            }
        }

        function populateSongFilter() {
            const filterSelect = document.getElementById('filter-song');
            
            if (viewMode === 'GAMES') {
                filterSelect.style.display = 'none';
                return;
            }

            filterSelect.style.display = '';
            const activePool = allScores.filter(s => !s.isMiniGame);
            const uniqueTitles = [...new Set(activePool.map(s => s.song))];
            
            // Sort dropdown options by Difficulty first (Hard > Medium > Easy), then alphabetically
            uniqueTitles.sort((a, b) => {
                const weightA = DIFFICULTY_WEIGHT[SONG_DIFFICULTIES[a] || "Unknown"] || 0;
                const weightB = DIFFICULTY_WEIGHT[SONG_DIFFICULTIES[b] || "Unknown"] || 0;
                if (weightA !== weightB) {
                    return weightB - weightA; 
                }
                return a.localeCompare(b);
            });

            filterSelect.innerHTML = `<option value="ALL">All Songs</option>`;
            uniqueTitles.forEach(title => {
                const opt = document.createElement('option');
                opt.value = title;
                opt.textContent = title;
                filterSelect.appendChild(opt);
            });
        }

        function isToday(dateString) {
            if (!dateString) return false;
            const d = new Date(dateString);
            if (isNaN(d.getTime())) return false;
            const today = new Date();
            return d.getDate() === today.getDate() &&
                   d.getMonth() === today.getMonth() &&
                   d.getFullYear() === today.getFullYear();
        }

        function renderSongLeaderboard() {
            const filterValue = document.getElementById('filter-song').value;
            const tbody = document.getElementById('leaderboard-body');

            let pool = allScores.filter(s => !s.isMiniGame);
            let filtered;

            if (filterValue === 'ALL') {
                // Exclude "Student A" and "Anonymous" from the Main Leaderboard
                filtered = pool.filter(s => {
                    const nameLower = s.name.trim().toLowerCase();
                    return nameLower !== 'student a' && nameLower !== 'anonymous';
                });
            } else {
                // Include all entries (including Student A and Anonymous) for specific song filter
                filtered = pool.filter(s => s.song === filterValue);
            }

            if (dateSortMode === 'NEWEST') {
                filtered.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            } else if (dateSortMode === 'OLDEST') {
                filtered.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
            } else {
                // EXPLICIT SORTING: 1. Song Difficulty -> 2. Accuracy -> 3. Tempo Speed
                filtered.sort((a, b) => {
                    const weightA = DIFFICULTY_WEIGHT[SONG_DIFFICULTIES[a.song] || "Unknown"] || 0;
                    const weightB = DIFFICULTY_WEIGHT[SONG_DIFFICULTIES[b.song] || "Unknown"] || 0;
                    
                    // 1. Difficulty (Hard > Medium > Easy)
                    if (weightA !== weightB) return weightB - weightA;
                    
                    // 2. Accuracy (Descending)
                    if (b.accuracy !== a.accuracy) return b.accuracy - a.accuracy;
                    
                    // 3. Tempo Speed (Descending)
                    return b.speed - a.speed;
                });
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="status-msg">No high scores found for this selection.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            filtered.forEach((item) => {
                const tr = document.createElement('tr');

                // Medal Logic
                let rankBadge = `<span class="rank-badge rank-other">${item.songRank}</span>`;
                if (item.songRank === 1) rankBadge = `<span class="rank-badge rank-1">🥇</span>`;
                else if (item.songRank === 2) rankBadge = `<span class="rank-badge rank-2">🥈</span>`;
                else if (item.songRank === 3) rankBadge = `<span class="rank-badge rank-3">🥉</span>`;

                let positionText = `${item.songRank}/${item.songTotal}`;

                // Date styling logic: pink + home icon if outside school hours, yellow if today, gray default
                const isHome = isOutsideSchoolHours(item.timestamp);
                let dateStyle = 'color: #9ca3af;';
                
                if (isHome) {
                    dateStyle = 'font-weight: 700; color: var(--home-pink);';
                } else if (isToday(item.timestamp)) {
                    dateStyle = 'font-weight: 700; color: #facc15;';
                }

                const homeIcon = isHome ? ' <span class="home-icon" title="Achieved outside school hours">🏠</span>' : '';
                
                // Fetch difficulty for dedicated column
                const diff = SONG_DIFFICULTIES[item.song] || 'N/A';

                tr.innerHTML = `
                    <td>${rankBadge}</td>
                    <td style="font-weight: 700; color: #9ca3af;">${positionText}</td>
                    <td style="font-weight: 600; color: #fff;">${item.name}</td>
                    <td>${item.song}</td>
                    <td style="color: #9ca3af; font-weight: 600;">${diff}</td>
                    <td class="score-highlight">${item.accuracy.toFixed(1)}%</td>
                    <td>${item.speed}%</td>
                    <td style="font-size: 0.8rem; ${dateStyle}">${item.timestamp || 'N/A'}${homeIcon}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderArcadeDashboard() {
            const dashboard = document.getElementById('arcade-dashboard');
            dashboard.innerHTML = '';

            MINI_GAMES.forEach(gameConfig => {
                const colDiv = document.createElement('div');
                colDiv.className = 'arcade-column';

                const header = document.createElement('div');
                header.className = 'arcade-column-header';
                header.textContent = gameConfig.title;
                colDiv.appendChild(header);

                let gameScores = allScores.filter(s => s.song.toLowerCase().includes(gameConfig.key));

                gameScores.sort((a, b) => {
                    return gameConfig.sortAsc ? a.accuracy - b.accuracy : b.accuracy - a.accuracy;
                });

                const topScores = gameScores.slice(0, 8);

                if (topScores.length === 0) {
                    const emptyMsg = document.createElement('div');
                    emptyMsg.className = 'status-msg';
                    emptyMsg.style.fontSize = '0.8rem';
                    emptyMsg.textContent = 'No scores yet!';
                    colDiv.appendChild(emptyMsg);
                } else {
                    topScores.forEach((score, idx) => {
                        const row = document.createElement('div');
                        row.className = 'arcade-row';

                        let badge = `<span class="rank-badge rank-other">${idx + 1}</span>`;
                        if (idx === 0) badge = `<span class="rank-badge rank-1">🥇</span>`;
                        else if (idx === 1) badge = `<span class="rank-badge rank-2">🥈</span>`;
                        else if (idx === 2) badge = `<span class="rank-badge rank-3">🥉</span>`;

                        let formattedVal = `${score.accuracy.toFixed(1)}%`;
                        if (gameConfig.key === 'simon taps') formattedVal = `Lvl ${Math.round(score.accuracy)}`;
                        else if (gameConfig.key === 'mystery note') formattedVal = `${Math.round(score.accuracy)} Guesses`;
                        else if (gameConfig.key === 'finger sprint') formattedVal = `${score.accuracy.toFixed(2)}s`;

                        row.innerHTML = `
                            <div style="display:flex; align-items:center; gap:6px;">
                                ${badge}
                                <span class="arcade-row-name">${score.name}</span>
                            </div>
                            <span class="score-highlight">${formattedVal}</span>
                        `;
                        colDiv.appendChild(row);
                    });
                }
                dashboard.appendChild(colDiv);
            });
        }

        function toggleViewMode() {
            const container = document.getElementById('main-container');
            const toggleBtn = document.getElementById('btn-toggle-mode');
            const titleEl = document.getElementById('leaderboard-title');
            const songTable = document.getElementById('song-table-wrapper');
            const arcadeDash = document.getElementById('arcade-dashboard');

            if (viewMode === 'SONGS') {
                viewMode = 'GAMES';
                container.classList.add('wide-mode');
                titleEl.textContent = '🕹️ Mini-Game Leaderboard Dashboard';
                songTable.style.display = 'none';
                arcadeDash.style.display = 'grid';
                toggleBtn.textContent = '🎵 SONG Leaderboard';
                toggleBtn.className = 'btn btn-song-mode';
                renderArcadeDashboard();
            } else {
                viewMode = 'SONGS';
                container.classList.remove('wide-mode');
                titleEl.textContent = '🏆 PianoPad Song High Scores';
                arcadeDash.style.display = 'none';
                songTable.style.display = '';
                toggleBtn.textContent = '🎮 MINI-GAME Leaderboard';
                toggleBtn.className = 'btn btn-arcade';
                renderSongLeaderboard();
            }

            populateSongFilter();
        }

        async function fetchScores() {
            try {
                // Fetch live song difficulties first
                await fetchLiveSongDifficulties();

                let csvText = '';
                const cacheBuster = '&_t=' + Date.now();

                // Try fetching live sheet directly (bypasses Google Web Publishing 15-minute delay)
                try {
                    const resDirect = await fetch(SPREADSHEET_DIRECT_CSV_URL + cacheBuster, { cache: 'no-store' });
                    if (resDirect.ok) {
                        csvText = await resDirect.text();
                    } else {
                        throw new Error('Direct export failed');
                    }
                } catch (e) {
                    // Fallback to published web CSV if direct export fails
                    const resPub = await fetch(LEADERBOARD_CSV_URL + cacheBuster, { cache: 'no-store' });
                    if (!resPub.ok) throw new Error('Published CSV response error');
                    csvText = await resPub.text();
                }

                allScores = parseCSV(csvText);

                // Update Total Scores Label
                const totalDisplay = document.getElementById('total-scores-display');
                if (totalDisplay) {
                    totalDisplay.textContent = `Leaderboard Scores = ${allScores.length}`;
                }

                // Compute global rank and total entries per individual song
                let songRanks = {};
                allScores.filter(s => !s.isMiniGame).forEach(s => {
                    if (!songRanks[s.song]) songRanks[s.song] = [];
                    songRanks[s.song].push(s);
                });

                for (let song in songRanks) {
                    // Internal ranking per song purely uses Accuracy then Tempo Speed
                    songRanks[song].sort((a, b) => {
                        if (b.accuracy !== a.accuracy) return b.accuracy - a.accuracy;
                        return b.speed - a.speed;
                    });
                    songRanks[song].forEach((s, idx) => {
                        s.songRank = idx + 1;
                        s.songTotal = songRanks[song].length;
                    });
                }

                populateSongFilter();
                if (viewMode === 'SONGS') {
                    renderSongLeaderboard();
                } else {
                    renderArcadeDashboard();
                }
            } catch (err) {
                console.error(err);
                document.getElementById('leaderboard-body').innerHTML = 
                    '<tr><td colspan="8" class="status-msg" style="color:#ef4444;">Failed to load leaderboard data. Please ensure the CSV link is public.</td></tr>';
            }
        }

        document.getElementById('filter-song').addEventListener('change', renderSongLeaderboard);
        document.getElementById('btn-toggle-mode').addEventListener('click', toggleViewMode);
        
        document.getElementById('th-date-sort').addEventListener('click', () => {
            const icon = document.getElementById('date-sort-icon');
            if (dateSortMode === 'DEFAULT') {
                dateSortMode = 'NEWEST';
                icon.textContent = '⬇️';
            } else if (dateSortMode === 'NEWEST') {
                dateSortMode = 'OLDEST';
                icon.textContent = '⬆️';
            } else {
                dateSortMode = 'DEFAULT';
                icon.textContent = '↕️';
            }
            renderSongLeaderboard();
        });

        // Initial fetch on page load
        fetchScores();

        // Auto-refresh scores every 30 seconds and when switching back to this tab
        setInterval(fetchScores, 30000);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') fetchScores();
        });
    </script>
</body>
</html>
